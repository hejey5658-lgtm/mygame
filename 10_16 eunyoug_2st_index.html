oke=\"#2D3E63\" stroke-width=\"2\"/>' +\n      '<path d=\"M110 36 q18 -4 28 8 q4 12 -8 14 q-8 0 -10 10 q-6 6 -12 -2 q-4 -14 2 -30z\" fill=\"#4CAF86\" stroke=\"#2D3E63\" stroke-width=\"2\"/>' +\n      '<path d=\"M104 96 q12 -6 22 2 q6 12 -6 20 q-12 6 -18 -4 q-4 -10 2 -18z\" fill=\"#4CAF86\" stroke=\"#2D3E63\" stroke-width=\"2\"/>' +\n      '<ellipse cx=\"100\" cy=\"78\" rx=\"56\" ry=\"17\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" opacity=\".5\"/>' +\n    '<\/g>' +\n    '<circle cx=\"80\" cy=\"56\" r=\"10\" fill=\"#fff\" opacity=\".25\"/>' +\n    '<path d=\"M100 12 A66 66 0 0 1 100 144\" fill=\"none\" stroke=\"#F2B705\" stroke-width=\"6\" stroke-linecap=\"round\"/>' +\n    '<circle cx=\"100\" cy=\"12\" r=\"5\" fill=\"#FFE7A3\" stroke=\"#2D3E63\" stroke-width=\"2\"/>' +\n    '<path d=\"' + starPath(30, 30, 9, 3.8) + '\" fill=\"#F2B705\" stroke=\"#2D3E63\" stroke-width=\"1.2\"/>' +\n    '<path d=\"' + starPath(172, 46, 7, 3) + '\" fill=\"#FFE7A3\" stroke=\"#2D3E63\" stroke-width=\"1.2\"/>' +\n    '<path d=\"' + starPath(166, 128, 6, 2.6) + '\" fill=\"#F2B705\" stroke=\"#2D3E63\" stroke-width=\"1.2\"/><\/svg>';\n\n  function bouquetTrio(width) {\n    const lab = ['가족', '친구', '이웃'];\n    let s = '<svg viewBox=\"0 0 360 150\" width=\"' + width + '\" aria-label=\"4송이, 6송이, 10송이 꽃다발\">';\n    [4, 6, 10].forEach((n, i) => {\n      s += '<g transform=\"translate(' + (i * 120) + ',0)\">' + bouquetSVG(n, RAINBOW.concat(RAINBOW).slice(i, i + n)) +\n           '<text x=\"60\" y=\"146\" text-anchor=\"middle\" font-size=\"13\" fill=\"#51618A\">' + lab[i] + ' ' + n + '송이<\/text><\/g>';\n    });\n    return s + '<\/svg>';\n  }\n  const art = (str, w) => str.replace('WIDTH', w);\n\n  // ================= 이야기 + 단계 데이터 =================\n  const CHAPTERS = [\n    {\n      key: 'gem', chip: '1 보석', item: gemSVG, colors: RAINBOW,\n      goals: [{ name: '목걸이', need: 7 }, { name: '귀걸이', need: 7 }, { name: '팔찌', need: 7 }],\n      voice: '당신만의 보석이에요!', hit: '앗! 망치에 보석이 깨졌어요',\n      intro: { kicker: '1단계', title: '일곱 빛깔 보석',\n        story: '빨강, 주황, 노랑, 초록, 파랑… 색은 모두 달라도 <b>덜 소중한 보석은 하나도 없어요.<\/b> 사람도 그래요. 보석을 줄에 꿰어 목걸이, 귀걸이, 팔찌를 만들어요.<br>함께 떨어지는 망치는 \"넌 별로야\" 같은 아픈 말이에요. 잘 피해서 반짝임을 지켜요!',\n        rule: '줄 하나에 보석 7개 → 목걸이 · 귀걸이 · 팔찌' },\n      reward: { title: '보석함 완성!', voice: '보석함이 완성됐어요! 나를 아끼는 마음이 나만의 보석함이에요.',\n        story: '서로 다른 보석들이 한 상자에 모였어요. <b>나를 아끼는 마음<\/b>이 바로 나만의 보석함이에요.',\n        art: () => art(JEWEL_BOX, 190) }\n    },\n    {\n      key: 'star', chip: '2 별', item: starSVG, colors: STAR_COLORS,\n      goals: CONSTELLATIONS.map(c => ({ name: c.name, need: c.pts.length, con: c })),\n      voice: '당신도 누군가의 별이에요!', hit: '앗! 별빛 하나가 흩어졌어요',\n      intro: { kicker: '2단계', title: '우주의 반짝별',\n        story: '별은 혼자서도 빛나지만, <b>서로 이어지면 별자리가 돼요.<\/b> 사람도 서로 이어질 때 이야기가 생겨요.<br>초승달로 별을 받아 용기의 오리온자리, 우정의 쌍둥이자리, 나눔의 물병자리를 그려요.',\n        rule: '별을 받을 때마다 별자리에 불이 켜져요' },\n      reward: { title: '지구본 완성!', voice: '지구본이 완성됐어요! 지구 위의 모든 사람이 빛나고 있어요.',\n        story: '별빛이 지구 위 모든 사람을 비추고 있어요. <b>지구본 어디에 있든, 누구든<\/b> 하늘이 기억하는 소중한 별이에요.',\n        art: () => art(GLOBE, 180) }\n    },\n    {\n      key: 'flower', chip: '3 꽃', item: flowerSVG, colors: RAINBOW,\n      goals: [{ name: '꽃다발 4송이', need: 4, who: '가족' }, { name: '꽃다발 6송이', need: 6, who: '친구' }, { name: '꽃다발 10송이', need: 10, who: '이웃' }],\n      voice: '이 꽃다발은 당신을 위한 거예요!', hit: '앗! 꽃잎이 떨어졌어요',\n      intro: { kicker: '3단계', title: '일곱 빛깔 꽃',\n        story: '이제 받은 반짝임을 <b>나눌 차례<\/b>예요. 꽃바구니로 꽃을 받아<br>4송이는 가족에게, 6송이는 친구에게, 10송이는 아직 만나지 못한 세상의 이웃에게 꽃다발로 전해요.',\n        rule: '꽃 4송이 → 6송이 → 10송이 꽃다발' },\n      reward: { title: '꽃다발 완성!', voice: '꽃다발이 모두 완성됐어요!',\n        story: '가족과 친구, 그리고 이웃에게 꽃다발이 전해졌어요. <b>받는 사람도, 주는 당신도<\/b> 모두 소중해요.',\n        art: () => bouquetTrio(260) }\n    }\n  ];\n\n  // ================= 상태 =================\n  const scene = document.getElementById('scene');\n  const catcher = document.getElementById('catcher');\n  const targetArt = document.getElementById('targetArt');\n  const targetLabel = document.getElementById('targetLabel');\n  const bubble = document.getElementById('sceneBubble');\n  const goalName = document.getElementById('goalName');\n  const goalCount = document.getElementById('goalCount');\n  const accIcons = document.getElementById('accIcons');\n  const chips = [0, 1, 2].map(i => document.getElementById('chip' + i));\n  const panel = document.getElementById('panel');\n  const panelArt = document.getElementById('panelArt');\n  const panelKicker = document.getElementById('panelKicker');\n  const panelTitle = document.getElementById('panelTitle');\n  const panelStory = document.getElementById('panelStory');\n  const panelRule = document.getElementById('panelRule');\n  const panelBtn = document.getElementById('panelBtn');\n  const previewBtn = document.getElementById('previewBtn');\n  const joystick = document.getElementById('joystick');\n  const stickGroup = document.getElementById('stickGroup');\n\n  let sceneW = 0, sceneH = 0, catchX = 0;\n  let ch = 0, goal = 0;\n  let progress = [];     // 지금 목표에 모은 색들\n  let items = [];\n  let running = false, paused = false, rafId = 0, lastTime = 0, spawnTimer = 0;\n  let joyActive = false, keyDir = 0, pointerActive = false;\n  let panelAction = null;\n\n  // ---------- 소리 ----------\n  function speak(text) {\n    if (!('speechSynthesis' in window)) return;\n    const u = new SpeechSynthesisUtterance(text);\n    u.lang = 'ko-KR'; u.pitch = 1.15; u.rate = 1.0;\n    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);\n  }\n  previewBtn.addEventListener('click', () => speak('당신만의 보석이에요!'));\n  if (!('speechSynthesis' in window)) { previewBtn.disabled = true; previewBtn.textContent = '🔇 음성 미지원 브라우저'; }\n\n  // ---------- 화면 ----------\n  function measure() {\n    const r = scene.getBoundingClientRect();\n    sceneW = r.width; sceneH = r.height;\n    if (!catchX) catchX = sceneW / 2;\n    clampCatcher();\n  }\n  function clampCatcher() { catchX = Math.max(CATCH_W / 2, Math.min(sceneW - CATCH_W / 2, catchX)); }\n\n  function showBubble(text, warn) {\n    bubble.textContent = text;\n    bubble.classList.toggle('warn', !!warn);\n    bubble.classList.remove('show'); void bubble.offsetWidth; bubble.classList.add('show');\n  }\n\n  function goalIcon(c, g) {\n    if (c === 0) {\n      return [\n        '<svg viewBox=\"0 0 26 26\"><path d=\"M5 4 Q13 20 21 4\" fill=\"none\" stroke=\"#F2B705\" stroke-width=\"2\"/><circle cx=\"13\" cy=\"15\" r=\"3.5\" fill=\"#E0567A\" stroke=\"#2D3E63\" stroke-width=\"1.4\"/><circle cx=\"8\" cy=\"10\" r=\"2\" fill=\"#4F8FE0\"/><circle cx=\"18\" cy=\"10\" r=\"2\" fill=\"#4CAF86\"/><\/svg>',\n        '<svg viewBox=\"0 0 26 26\"><path d=\"M8 3 v5 M18 3 v5\" stroke=\"#F2B705\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M8 9 L11 15 L8 22 L5 15 Z\" fill=\"#4F8FE0\" stroke=\"#2D3E63\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><path d=\"M18 9 L21 15 L18 22 L15 15 Z\" fill=\"#9B7FD4\" stroke=\"#2D3E63\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg>',\n        '<svg viewBox=\"0 0 26 26\"><circle cx=\"13\" cy=\"13\" r=\"8\" fill=\"none\" stroke=\"#F2B705\" stroke-width=\"2\"/><circle cx=\"13\" cy=\"5\" r=\"2.6\" fill=\"#9B7FD4\" stroke=\"#2D3E63\" stroke-width=\"1.2\"/><circle cx=\"21\" cy=\"13\" r=\"2.6\" fill=\"#E0567A\" stroke=\"#2D3E63\" stroke-width=\"1.2\"/><circle cx=\"13\" cy=\"21\" r=\"2.6\" fill=\"#4CAF86\" stroke=\"#2D3E63\" stroke-width=\"1.2\"/><circle cx=\"5\" cy=\"13\" r=\"2.6\" fill=\"#F2935C\" stroke=\"#2D3E63\" stroke-width=\"1.2\"/><\/svg>'\n      ][g];\n    }\n    if (c === 1) {\n      const con = CONSTELLATIONS[g];\n      return '<svg viewBox=\"0 0 200 150\"><rect width=\"200\" height=\"150\" rx=\"24\" fill=\"#2D3E63\"/>' + constellationSVG(con, con.pts.length) + '<\/svg>';\n    }\n    const n = [4, 6, 10][g];\n    return '<svg viewBox=\"0 0 120 135\">' + bouquetSVG(n, RAINBOW.concat(RAINBOW).slice(0, n)) + '<\/svg>';\n  }\n\n  function updateHud() {\n    const C = CHAPTERS[ch];\n    chips.forEach((el, i) => { el.classList.toggle('now', i === ch); el.classList.toggle('done', i < ch); });\n    if (goal >= 3) { goalName.textContent = C.reward.title.replace(' 완성!', ''); goalCount.textContent = '완성!'; }\n    else { goalName.textContent = C.goals[goal].name; goalCount.textContent = progress.length + '/' + C.goals[goal].need; }\n    accIcons.innerHTML = C.goals.map((_, g) =>\n      '<div class=\"acc-icon' + (g < goal ? ' done' : g === goal ? ' current' : '') + '\" title=\"' + C.goals[g].name + '\">' + goalIcon(ch, g) + '<\/div>').join('');\n  }\n\n  // 1단계: 줄 위 구슬\n  function beadPoint(i, need) {\n    const t = (i + 1) / (need + 1), p0 = [10, 12], p1 = [80, 60], p2 = [150, 12];\n    return [(1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * p1[0] + t * t * p2[0],\n            (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * p1[1] + t * t * p2[1]];\n  }\n  function renderProgress() {\n    const C = CHAPTERS[ch], G = C.goals[Math.min(goal, 2)];\n    if (ch === 0) {\n      targetArt.classList.add('hidden'); targetLabel.textContent = '';\n      const g = document.getElementById('beads');\n      if (g) g.innerHTML = progress.map((c, i) => {\n        const [x, y] = beadPoint(i, G.need);\n        return '<g transform=\"translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')\"><path d=\"M0 -7.5 L6.5 -1.5 L0 7.5 L-6.5 -1.5 Z\" fill=\"' + c + '\" stroke=\"' + PEN + '\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><circle cx=\"-2\" cy=\"-2.5\" r=\"1.6\" fill=\"#fff\" opacity=\".85\"/><\/g>';\n      }).join('');\n    } else if (ch === 1) {\n      targetArt.classList.remove('hidden');\n      targetArt.setAttribute('viewBox', '0 0 200 150'); targetArt.setAttribute('width', '210');\n      targetArt.innerHTML = constellationSVG(G.con, progress.length);\n      targetLabel.textContent = '✦ ' + G.con.name + ' · ' + G.con.meaning + ' ✦';\n    } else {\n      targetArt.classList.remove('hidden');\n      targetArt.setAttribute('viewBox', '0 0 120 135'); targetArt.setAttribute('width', '150');\n      targetArt.innerHTML = bouquetSVG(G.need, progress);\n      targetLabel.textContent = '🌷 ' + G.who + '에게 줄 ' + G.name + ' 🌷';\n    }\n    updateHud();\n  }\n\n  // ---------- 낙하물 ----------\n  function spawn() {\n    const C = CHAPTERS[ch];\n    const isHammer = Math.random() < 0.22 + goal * 0.05 + ch * 0.03;\n    const color = C.colors[(Math.random() * C.colors.length) | 0];\n    const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n    el.setAttribute('viewBox', '0 0 28 28'); el.setAttribute('class', 'falling');\n    el.innerHTML = isHammer ? hammerSVG() : C.item(color);\n    scene.insertBefore(el, bubble);\n    items.push({\n      el, type: isHammer ? 'hammer' : 'good', color,\n      x: 20 + Math.random() * (sceneW - 40), y: -24,\n      vx: (Math.random() < 0.5 ? -1 : 1) * (8 + Math.random() * 22),\n      vy: 70 + Math.random() * 30 + goal * 8 + ch * 8,\n      r: 13, rot: 0, vrot: isHammer ? (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 2) : (Math.random() - .5)\n    });\n  }\n  function clearItems() { items.forEach(it => it.el.remove()); items = []; }\n\n  function burst(x, y, color, n) {\n    for (let i = 0; i < n; i++) {\n      const s = document.createElement('span'), size = 4 + Math.random() * 3;\n      s.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size +\n        'px;border-radius:50%;background:' + color + ';pointer-events:none;z-index:5;';\n      scene.appendChild(s);\n      const a = Math.random() * Math.PI * 2, d = 18 + Math.random() * 34;\n      s.animate([{ transform: 'translate(0,0)', opacity: 1 },\n                 { transform: 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d + 20) + 'px)', opacity: 0 }],\n                { duration: 600, easing: 'ease-out' }).onfinish = () => s.remove();\n    }\n  }\n  function shakeCatcher() { catcher.classList.remove('shake'); void catcher.getBoundingClientRect(); catcher.classList.add('shake'); }\n\n  // ---------- 목표 완성 / 단계 완성 ----------\n  function completeGoal() {\n    paused = true;\n    clearItems();\n    const C = CHAPTERS[ch];\n    catcher.classList.add('glow');\n    showBubble(C.goals[goal].name + ' 완성! ' + C.voice);\n    speak(C.voice);\n    burst(catchX, sceneH - 40, '#F2B705', 22);\n    goal++;\n    updateHud();\n    setTimeout(() => {\n      catcher.classList.remove('glow');\n      progress = [];\n      if (goal >= C.goals.length) { endChapter(); return; }\n      renderProgress();\n      showBubble('이번엔 ' + C.goals[goal].name + '!');\n      paused = false;\n    }, 1700);\n  }\n\n  function endChapter() {\n    running = false;\n    cancelAnimationFrame(rafId);\n    clearItems();\n    const C = CHAPTERS[ch];\n    speak(C.reward.voice);\n    showPanel({\n      art: C.reward.art(), kicker: (ch + 1) + '단계 완료', title: C.reward.title, story: C.reward.story, rule: '',\n      btn: ch < 2 ? '다음 이야기로 →' : '이야기의 끝으로 →',\n      action: () => (ch < 2 ? showIntro(ch + 1) : showEnding())\n    });\n  }\n\n  // ---------- 이야기 패널 ----------\n  function showPanel(o) {\n    panelArt.innerHTML = o.art || '';\n    panelKicker.textContent = o.kicker || '';\n    panelTitle.textContent = o.title || '';\n    panelStory.innerHTML = o.story || '';\n    panelRule.textContent = o.rule || '';\n    panelRule.style.display = o.rule ? '' : 'none';\n    panelBtn.textContent = o.btn;\n    panelAction = o.action;\n    panel.classList.remove('hidden');\n    panel.scrollTop = 0;\n  }\n  panelBtn.addEventListener('click', () => { if (panelAction) panelAction(); });\n\n  function showPrologue() {\n    ch = 0; goal = 0; progress = [];\n    setChapterLook(0); renderProgress();\n    showPanel({\n      art: '<svg viewBox=\"0 0 140 120\" width=\"120\" aria-hidden=\"true\"><path d=\"M68 58 C58 22, 22 6, 12 26 C4 44, 30 60, 66 62 Z M72 58 C82 22, 118 6, 128 26 C136 44, 110 60, 74 62 Z\" fill=\"#6E9BE0\" stroke=\"#2D3E63\" stroke-width=\"3\"/><path d=\"M66 64 C44 66, 26 84, 36 100 C46 112, 62 92, 68 70 Z M74 64 C96 66, 114 84, 104 100 C94 112, 78 92, 72 70 Z\" fill=\"#A9C8F2\" stroke=\"#2D3E63\" stroke-width=\"3\"/><path d=\"M70 46 L70 92\" stroke=\"#2D3E63\" stroke-width=\"6\" stroke-linecap=\"round\"/><\/svg>',\n      kicker: '프롤로그', title: '블루나비의 반짝임 여행',\n      story: '세상에는 스스로 반짝임을 잃었다고 생각하는 사람들이 있어요. 블루나비는 그들에게 꼭 알려주고 싶었어요.<br><b>\"당신은 처음부터 보석이었어요.\"<\/b><br>보석, 별, 꽃을 모으는 세 번의 여행을 함께 떠나요!',\n      rule: '', btn: '여행 시작하기', action: () => showIntro(0)\n    });\n  }\n\n  function showIntro(c) {\n    ch = c; goal = 0; progress = [];\n    setChapterLook(c); renderProgress();\n    const I = CHAPTERS[c].intro;\n    showPanel({ art: '', kicker: I.kicker, title: I.title, story: I.story, rule: I.rule, btn: '시작하기', action: () => startChapter(c) });\n  }\n\n  function showEnding() {\n    chips.forEach(el => { el.classList.remove('now'); el.classList.add('done'); });\n    speak('세상 속 모든 사람은 보석처럼 가치 있는 존재예요. 당신도요.');\n    showPanel({\n      art: art(JEWEL_BOX, 92) + art(GLOBE, 84) + '<svg viewBox=\"0 0 120 135\" width=\"76\">' + bouquetSVG(10, RAINBOW.concat(RAINBOW).slice(0, 10)) + '<\/svg>',\n      kicker: '에필로그', title: '모든 사람은 보석이에요',\n      story: '보석은 상자 속에서, 별은 하늘에서, 꽃은 누군가의 손에서 빛나요.<br><b>세상 속 모든 사람은 보석처럼 가치 있는 존재예요.<\/b><br>그리고 여기까지 온 당신도요. 💎',\n      rule: '', btn: '처음부터 다시', action: showPrologue\n    });\n  }\n\n  function setChapterLook(c) {\n    scene.dataset.ch = String(c);\n    catcher.innerHTML = CATCHERS[c];\n    catcher.setAttribute('aria-label', ['액세서리 줄', '초승달', '꽃바구니'][c]);\n  }\n\n  function startChapter(c) {\n    measure();\n    ch = c; goal = 0; progress = [];\n    clearItems();\n    setChapterLook(c);\n    renderProgress();\n    panel.classList.add('hidden');\n    paused = false; spawnTimer = 0; running = true;\n    lastTime = performance.now();\n    cancelAnimationFrame(rafId);\n    rafId = requestAnimationFrame(loop);\n    showBubble('먼저 ' + CHAPTERS[c].goals[0].name + '부터!');\n  }\n\n  // ---------- 루프 ----------\n  function update(dt) {\n    if (keyDir !== 0) catchX += keyDir * 230 * dt;\n    clampCatcher();\n    catcher.style.left = catchX + 'px';\n    if (paused) return;\n\n    const C = CHAPTERS[ch], G = C.goals[goal];\n    spawnTimer += dt;\n    if (spawnTimer > Math.max(0.95 - goal * 0.1 - ch * 0.05, 0.55)) { spawnTimer = 0; spawn(); }\n\n    const catchTop = sceneH - 10 - (CATCH_VB_H * CATCH_W / CATCH_VB_W) + 8;\n    const left = catchX - CATCH_W / 2 + 8, right = catchX + CATCH_W / 2 - 8;\n    let completed = false;\n\n    for (let i = items.length - 1; i >= 0; i--) {\n      const it = items[i];\n      if (!it) continue;\n      it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vrot * dt;\n      if (it.x - it.r < 0) { it.x = it.r; it.vx = Math.abs(it.vx); }\n      else if (it.x + it.r > sceneW) { it.x = sceneW - it.r; it.vx = -Math.abs(it.vx); }\n\n      if (it.y + it.r >= catchTop && it.y - it.r <= catchTop + 26 && it.x >= left && it.x <= right) {\n        if (it.type === 'good') {\n          progress.push(it.color);\n          burst(it.x, it.y, it.color, 8);\n          if (progress.length >= G.need) completed = true;\n          renderProgress();\n        } else {\n          shakeCatcher();\n          if (progress.length) { progress.pop(); renderProgress(); }\n          burst(it.x, it.y, '#9AA6BC', 12);\n          showBubble(C.hit, true);\n        }\n        it.el.remove(); items.splice(i, 1);\n        if (completed) break;\n        continue;\n      }\n      if (it.y - it.r > sceneH + 10) { it.el.remove(); items.splice(i, 1); continue; }\n      it.el.style.transform = 'translate(' + (it.x - 14) + 'px,' + (it.y - 14) + 'px) rotate(' + it.rot + 'rad)';\n    }\n    // 배열 순회가 끝난 뒤에만 완성 처리 (순회 중 items를 비우지 않기)\n    if (completed) completeGoal();\n  }\n\n  function loop(now) {\n    if (!running) return;\n    const dt = Math.min((now - lastTime) / 1000, 0.05);\n    lastTime = now;\n    update(dt);\n    if (running) rafId = requestAnimationFrame(loop);\n  }\n\n  // ---------- 조
