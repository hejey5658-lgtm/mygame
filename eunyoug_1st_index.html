8px;\n    border-radius: 16px;\n    display: none;\n    align-items: center; justify-content: center;\n    background: rgba(47, 74, 42, .35);\n    backdrop-filter: blur(3px);\n    -webkit-backdrop-filter: blur(3px);\n    padding: 10px;\n  }\n  .over.show { display: flex; animation: fade .25s ease-out; }\n  .over-card {\n    background: #FFFFFF;\n    border-radius: 20px;\n    padding: clamp(12px, 3vw, 22px) clamp(20px, 6vw, 40px);\n    text-align: center;\n    box-shadow: 0 8px 0 #CFE5C4;\n    animation: lift .35s cubic-bezier(.25,1.5,.5,1);\n  }\n  .over-emoji { font-size: clamp(1.6rem, 6vw, 2.4rem); line-height: 1; }\n  .over-card h2 { margin: 4px 0 2px; font-weight: 400; font-size: clamp(1.5rem, 6vw, 2.2rem); color: #C2492F; }\n  .message { margin: 2px 0 6px; font-size: clamp(1rem, 4vw, 1.25rem); color: var(--leaf-d); word-break: keep-all; }\n  .message:empty { display: none; }\n  .over-card.win h2 { color: #E07A2E; }\n  .record { margin: 0 0 clamp(8px, 2vw, 14px); font-size: clamp(1rem, 4vw, 1.3rem); }\n  .record b { font-weight: 400; color: var(--leaf-d); font-size: 1.3em; }\n  .again {\n    font-family: inherit;\n    font-size: clamp(1rem, 4vw, 1.2rem);\n    color: #FFFFFF;\n    background: var(--leaf);\n    border: none;\n    border-radius: 999px;\n    padding: 10px 28px;\n    cursor: pointer;\n    box-shadow: 0 4px 0 var(--leaf-d);\n  }\n  .again:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--leaf-d); }\n  .again:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }\n  @keyframes fade { from { opacity: 0; } }\n  @keyframes lift { from { transform: translateY(16px) scale(.92); opacity: 0; } }\n  @media (prefers-reduced-motion: reduce) { .over.show, .over-card { animation: none; } }\n\n  .help { margin: 4px 0 0; text-align: center; opacity: .7; font-size: 1rem; }\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n  <a class=\"home\" href=\"#\" onclick=\"parent.postMessage('go-home', '*'); return false;\">← 게임장으로<\/a>\n  <h1>캥거루 달리기<\/h1>\n  <div class=\"stage\">\n    <canvas id=\"game\" aria-label=\"캥거루 달리기 게임 화면\"><\/canvas>\n    <button class=\"dodge\" id=\"dodgeBtn\" disabled aria-label=\"초원으로 피하기\">🌿 초원으로 피하기 <b id=\"dodgeCount\">0<\/b><\/button>\n    <div class=\"over\" id=\"over\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"overTitle\">\n      <div class=\"over-card\">\n        <div class=\"over-emoji\" id=\"overEmoji\" aria-hidden=\"true\">💫<\/div>\n        <h2 id=\"overTitle\">게임 오버!<\/h2>\n        <p class=\"message\" id=\"overMsg\"><\/p>\n        <p class=\"record\">기록: <b id=\"record\">0<\/b>점<\/p>\n        <button class=\"again\" id=\"againBtn\">다시 하기<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n  <p class=\"help\">20초마다 단계 성공! 캥거루 가족이 한 마리씩 늘어나요 🦘<br>독수리를 2번 피하면 🌿 초원으로 한 번 비켜설 수 있어요 (← → 키 또는 버튼)<br>스페이스바 또는 화면을 클릭(탭)하면 점프! 여우 🦊 와 독수리 🦅 가 좌우로 움직이며 다가와요<\/p>\n<\/main>\n\n<script>\n  // =========================================================\n  //  세로 화면: 캥거루 뒤에서 앞을 바라보는 정면 시점\n  //  장애물은 멀리 지평선에서 작게 나타나 점점 커지며 다가옴\n  // =========================================================\n  const W = 360, H = 600;              // 화면 크기 (세로)\n  const GROUND_Y = 252;                // 높이 계산 기준 (z = GROUND_Y - y)\n  const TRACK_START = 810;             // 장애물이 처음 나타나는 거리\n\n  const canvas = document.getElementById(\"game\");\n  const ctx = canvas.getContext(\"2d\");\n  function fitCanvas() {\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    canvas.width = W * dpr;\n    canvas.height = H * dpr;\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n\n  // ---------- 캥거루 ----------\n  // x = 트랙 위 거리, y = 높이 계산용 (GROUND_Y 이면 땅)\n  const kangaroo = { x: 120, y: GROUND_Y, scale: 1.15, vy: 0, onGround: true, squash: 0, side: 0, dodges: [] };\n  const JUMP_SPEED = 640;\n  const GRAVITY = 1600;\n\n  let score = 0;\n  let gameOver = false;\n  const SCORE_PER_SEC = 10;\n\n  // 시간이 지날수록 완만하게 빨라짐: 0초 1배 → 30초 1.5배 → 60초 2배\n  let runTime = 0;\n  const speedMult = () => Math.min(2, 1 + runTime / 60);\n\n  // 20초마다 단계 성공 → 가족이 한 마리씩 늘어나고, 60초에 가족 완성\n  const STAGE_TIMES = [20, 40, 60];\n  const NEW_MEMBERS = [\n    { name: \"엄마 캥거루\", scale: 1.05, fur: [\"#D9A066\", \"#B9824A\", \"#F6DFC0\"] },\n    { name: \"아기 캥거루\", scale: 0.72, fur: [\"#D8955A\", \"#B57640\", \"#F4DABA\"] },\n    { name: \"막내 캥거루\", scale: 0.6,  fur: [\"#E0A570\", \"#BF8550\", \"#F7E2C6\"] }\n  ];\n  // 가족은 길 양옆 초원에서 나란히 달림 (ahead: 조금 앞, side: 옆으로)\n  const FAMILY_SPOTS = [{ ahead: 60, side: 152 }, { ahead: 40, side: -146 }, { ahead: 110, side: -192 }];\n  let stagesDone = 0;\n  let family = [];\n  let banner = null;\n  let won = false;\n\n  // 🌿 초원으로 피하기: 독수리를 2번 피할 때마다 1번 쓸 수 있음\n  const EAGLES_PER_DODGE = 2;\n  const DODGE_SIDE = 122;          // 길에서 옆으로 비켜서는 거리 (움직이는 동물도 닿지 않는 곳)\n  const DODGE_TIME = 1.25;         // 옆으로 나갔다 돌아오기까지 (초)\n  let eaglesDodged = 0;\n  let dodgeCharges = 0;\n  let nextDodgeDir = -1;\n  const dodgeBtn = document.getElementById(\"dodgeBtn\");\n  const dodgeCountEl = document.getElementById(\"dodgeCount\");\n\n  // ---------- 도구 ----------\n  const rand = (a, b) => a + Math.random() * (b - a);\n  function ell(x, y, rx, ry, rot, color) {\n    ctx.fillStyle = color;\n    ctx.beginPath();\n    ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);\n    ctx.fill();\n  }\n  function mix(c1, c2, t) {\n    const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);\n    const ch = sh => Math.round(((a >> sh) & 255) + ((((b >> sh) & 255) - ((a >> sh) & 255)) * t));\n    return `rgb(${ch(16)}, ${ch(8)}, ${ch(0)})`;\n  }\n  const green = (light, dark) => mix(light, dark, speedMult() - 1);\n\n  // ---------- 장애물 ----------\n  const RUN_SPEED = 260;\n  const SPAWN_MIN = 0.9, SPAWN_MAX = 2.3;\n  const obstacles = [];\n  let spawnTimer = 1.2;\n  let groundOffset = 0;\n  let clock = 0;\n\n  function randomSize() {\n    const r = Math.random();\n    if (r < 0.2) return rand(0.65, 0.8);\n    if (r > 0.8) return rand(1.3, 1.5);\n    return rand(0.9, 1.1);\n  }\n\n\n  function spawnObstacle() {\n    const r = Math.random();\n    const s = randomSize();\n    let o;\n    if (r < 0.55) {\n      const fs = s * 1.45;\n      o = { type: \"fox\", s: fs, w: 62 * fs, h: 40 * fs, y: GROUND_Y };\n      // 좌우로 지그재그\n      o.center = rand(-15, 15); o.amp = rand(25, 55); o.freq = rand(1.6, 2.6);\n    } else {\n      const es = s * 1.4;\n      const low = Math.random() < .5;   // 낮게(점프해서 넘기) 또는 높게(그냥 지나감)\n      o = { type: \"eagle\", s: es, w: 76 * es, h: 34 * es, baseY: low ? rand(222, 230) : rand(70, 95), phase: Math.random() * 6 };\n      o.y = o.baseY;\n      // 좌우로 크게 미끄러지듯\n      o.center = rand(-10, 10); o.amp = rand(25, 45); o.freq = rand(1.0, 1.8);\n    }\n    o.x = TRACK_START;\n    o.wob = Math.random() * Math.PI * 2;\n    o.side = o.center + Math.sin(o.wob) * o.amp;\n    o.vside = 0;\n    o.speed = RUN_SPEED + (o.type === \"eagle\" ? 70 : 0);\n    obstacles.push(o);\n  }\n\n  function updateObstacles(dt) {\n    const m = speedMult();\n    groundOffset += RUN_SPEED * m * dt;\n    clock += dt;\n    spawnTimer -= dt;\n    if (spawnTimer <= 0) {\n      spawnObstacle();\n      spawnTimer = rand(SPAWN_MIN, SPAWN_MAX);\n    }\n    for (let i = obstacles.length - 1; i >= 0; i--) {\n      const o = obstacles[i];\n      o.x -= o.speed * m * dt;\n      if (o.type === \"eagle\") o.y = o.baseY + Math.sin(clock * 3 + o.phase) * 8;\n      o.wob += o.freq * dt;\n      const newSide = o.center + Math.sin(o.wob) * o.amp;\n      o.vside = (newSide - o.side) / dt;     // 기울기 표현용\n      o.side = newSide;\n      if (o.x + o.w < kangaroo.x - 60) obstacles.splice(i, 1);   // 캥거루를 지나쳐 뒤로 가면 사라짐\n    }\n  }\n\n  // ---------- 원근 카메라: 캥거루 뒤에서 앞을 바라봄 ----------\n  // dist = 트랙 위 거리, lateral = 길 가운데에서 옆으로, z = 땅에서 높이\n  const HORIZON = 226;      // 지평선 화면 높이\n  const CAM_H = 232;        // 카메라 높이\n  const F = 250;            // 원근 세기\n  const CAM_BACK = 200;     // 카메라가 캥거루 뒤로 떨어진 거리\n  const ROAD_HALF = 70;     // 흙길 반쪽 폭\n  function proj(dist, lateral, z) {\n    const D = dist - kangaroo.x + CAM_BACK;\n    const s = F / D;\n    return { x: W / 2 + lateral * s, y: HORIZON + (CAM_H - z) * s, s, D };\n  }\n\n  // ---------- 하늘 · 먼 언덕 ----------\n  function drawSky() {\n    const g = ctx.createLinearGradient(0, 0, 0, HORIZON);\n    g.addColorStop(0, \"#8FD3F4\");\n    g.addColorStop(1, \"#E4F6FB\");\n    ctx.fillStyle = g;\n    ctx.fillRect(0, 0, W, HORIZON + 2);\n    ctx.fillStyle = \"rgba(255, 244, 179, .55)\";\n    ctx.beginPath(); ctx.arc(286, 112, 30, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = \"#FFE98A\";\n    ctx.beginPath(); ctx.arc(286, 112, 19, 0, Math.PI * 2); ctx.fill();\n    // 구름 (아주 천천히 흘러감)\n    [[40, 96, 1], [190, 70, .8], [300, 150, .6]].forEach(([x0, y, s]) => {\n      const x = ((x0 - clock * 6 * s) % (W + 120) + W + 120) % (W + 120) - 60;\n      ctx.fillStyle = \"rgba(255,255,255,.95)\";\n      ctx.beginPath();\n      ctx.arc(x, y, 14 * s, 0, Math.PI * 2);\n      ctx.arc(x + 17 * s, y - 8 * s, 17 * s, 0, Math.PI * 2);\n      ctx.arc(x + 37 * s, y - 2 * s, 13 * s, 0, Math.PI * 2);\n      ctx.rect(x, y, 38 * s, 12 * s);\n      ctx.fill();\n    });\n    // 지평선 언덕 두 겹\n    [[green(\"#CDEBB0\", \"#7BB868\"), 22, 70, .2], [green(\"#B6E094\", \"#5E9F4C\"), 12, 44, 1.3]].forEach(([c, amp, len, ph]) => {\n      ctx.fillStyle = c;\n      ctx.beginPath();\n      ctx.moveTo(0, HORIZON + 1);\n      for (let x = 0; x <= W; x += 6) {\n        ctx.lineTo(x, HORIZON - 4 - Math.abs(Math.sin(x / len + ph)) * amp - Math.sin(x / (len * .37)) * amp * .2);\n      }\n      ctx.lineTo(W, HORIZON + 1);\n      ctx.fill();\n    });\n  }\n\n  // ---------- 땅: 초원 줄무늬 + 흙길 ----------\n  function drawGround() {\n    ctx.fillStyle = green(\"#B4E37A\", \"#3F8F37\");\n    ctx.fillRect(0, HORIZON, W, H - HORIZON);\n    // 앞쪽으로 흘러오는 잔디 줄무늬\n    ctx.fillStyle = green(\"#C4EB8E\", \"#4C9B41\");\n    const BAND = 90;\n    const start = kangaroo.x - CAM_BACK + 20;\n    const first = Math.floor((start + groundOffset) / BAND) * BAND - groundOffset;\n    for (let d = first; d < kangaroo.x + 2600; d += BAND) {\n      if (Math.floor((d + groundOffset) / BAND + .5) % 2) continue;\n      const a = proj(Math.max(d, start), 0, 0), b = proj(d + BAND, 0, 0);\n      if (a.y <= b.y) continue;\n      ctx.fillRect(0, b.y, W, Math.min(H, a.y) - b.y);\n    }\n    // 흙길 (멀수록 좁아짐)\n    const nearD = kangaroo.x - CAM_BACK + 30, farD = kangaroo.x + 4000;\n    const nl = proj(nearD, -ROAD_HALF, 0), nr = proj(nearD, ROAD_HALF, 0);\n    const fl = proj(farD, -ROAD_HALF, 0), fr = proj(farD, ROAD_HALF, 0);\n    ctx.fillStyle = \"#D8B887\";\n    ctx.beginPath(); ctx.moveTo(nl.x, nl.y); ctx.lineTo(fl.x, fl.y); ctx.lineTo(fr.x, fr.y); ctx.lineTo(nr.x, nr.y); ctx.fill();\n    // 길 가장자리\n    ctx.strokeStyle = \"#BF9A66\";\n    ctx.lineWidth = 3;\n    ctx.beginPath(); ctx.moveTo(nl.x, nl.y); ctx.lineTo(fl.x, fl.y); ctx.moveTo(nr.x, nr.y); ctx.lineTo(fr.x, fr.y); ctx.stroke();\n    // 길 위 발자국 무늬가 다가옴\n    ctx.fillStyle = \"rgba(160, 120, 70, .28)\";\n    const STEP = 70;\n    const f2 = Math.floor((nearD + groundOffset) / STEP) * STEP - groundOffset;\n    for (let d = f2; d < kangaroo.x + 1500; d += STEP) {\n      if (d < nearD) continue;\n      [[-28, 0], [30, 35]].forEach(([lat, dd]) => {\n        const p = proj(d + dd, lat, 0);\n        if (p.D < 30) return;\n        ctx.beginPath(); ctx.ellipse(p.x, p.y, 7 * p.s, 2.6 * p.s, 0, 0, Math.PI * 2); ctx.fill();\n      });\n    }\n  }\n\n  // ---------- 길가 풍경 (나무·덤불·꽃·돌) ----------\n  const SCENERY = [];\n  const SCENE_SPAN = 1700;\n  (function makeScenery() {\n    for (let i = 0; i < 60; i++) {\n      const sideSign = i % 2 ? 1 : -1;\n      const r = (i * 37) % 10;\n      const kind = r < 2 ? \"tree\" : r < 4 ? \"bush\" : r < 7 ? \"flower\" : r < 8 ? \"rock\" : \"tuft\";\n      const lat = kind === \"tree\" ? rand(180, 420) : kind === \"bush\" ? rand(110, 320) : rand(84, 300);\n      SCENERY.push({ d: (i * 113) % SCENE_SPAN, lateral: sideSign * lat, kind, color: [\"#FFFFFF\", \"#FFE15A\", \"#FF9DB5\"][i % 3] });\n    }\n  })();\n\n  function sceneryDist(it) {\n    return kangaroo.x - 160 + (((it.d - groundOffset) % SCENE_SPAN) + SCENE_SPAN) % SCENE_SPAN;\n  }\n\n  function drawScenery(it, p) {\n    const s = p.s;\n    if (it.kind === \"tree\") {\n      ell(p.x + 8 * s, p.y, 40 * s, 10 * s, 0, \"rgba(30,60,25,.15)\");\n      ctx.fillStyle = \"#8A6A45\";\n      ctx.fillRect(p.x - 6 * s, p.y - 70 * s, 12 * s, 70 * s);\n      ctx.fillStyle = green(\"#5DAE4A\", \"#2C7A2A\");\n      ctx.beginPath();\n      ctx.arc(p.x, p.y - 112 * s, 40 * s, 0, Math.PI * 2);\n      ctx.arc(p.x - 30 * s, p.y - 86 * s, 28 * s, 0, Math.PI * 2);\n      ctx.arc(p.x + 30 * s, p.y - 86 * s, 28 * s, 0, Math.PI * 2);\n      ctx.fill();\n      ell(p.x - 12 * s, p.y - 128 * s, 13 * s, 8 * s, 0, \"rgba(255,255,255,.18)\");\n    } else if (it.kind === \"bush\") {\n      ctx.fillStyle = green(\"#7CC55B\", \"#2E7A2A\");\n      ctx.beginPath();\n      ctx.arc(p.x - 16 * s, p.y - 14 * s, 18 * s, 0, Math.PI * 2);\n      ctx.arc(p.x + 16 * s, p.y - 14 * s, 18 * s, 0, Math.PI * 2);\n      ctx.arc(p.x, p.y - 26 * s, 21 * s, 0, Math.PI * 2);\n      ctx.fill();\n    } else if (it.kind === \"flower\") {\n      ctx.strokeStyle = \"#4E9A3E\"; ctx.lineWidth = Math.max(1, 1.5 * s);\n      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 10 * s); ctx.stroke();\n      ctx.fillStyle = it.color;\n      for (let i = 0; i < 5; i++) {\n        const a = i / 5 * Math.PI * 2;\n        ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * 4 * s, p.y - 12 * s + Math.sin(a) * 4 * s, 3 * s, 0, Math.PI * 2); ctx.fill();\n      }\n      ctx.fillStyle = \"#F2A93B\";\n      ctx.beginPath(); ctx.arc(p.x, p.y - 12 * s, 2.2 * s, 0, Math.PI * 2); ctx.fill();\n    } else if (it.kind === \"rock\") {\n      ell(p.x, p.y - 6 * s, 14 * s, 9 * s, 0, \"#C7C2B4\");\n      ell(p.x - 3 * s, p.y - 10 * s, 6 * s, 3 * s, 0, \"#E2DDD0\");\n    } else {\n      ctx.strokeStyle = green(\"#8CC95A\", \"#2C6E28\");\n      ctx.lineWidth = Math.max(1, 2 * s); ctx.lineCap = \"round\";\n      ctx.beginPath();\n      ctx.moveTo(p.x - 5 * s, p.y); ctx.lineTo(p.x - 8 * s, p.y - 12 * s);\n      ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 15 * s);\n      ctx.moveTo(p.x + 5 * s, p.y); ctx.lineTo(p.x + 8 * s, p.y - 12 * s);\n      ctx.stroke();\n    }\n  }\n\n  // ---------- 캥거루 (뒷모습) ----------\n  function drawKangaroo(k, lateral, dist) {\n    const [FUR, FUR_D, BELLY] = k.fur || [\"#C98A4B\", \"#A86E36\", \"#F0D2A8\"];\n    const PINK = \"#F2A7A0\";\n    const z = GROUND_Y - k.y;\n    const g = proj(dist, lateral, 0);\n    if (g.D < 40) return;\n    const s = g.s;\n\n    // 그림자: 높이 뛸수록 작고 옅게\n    const t = Math.max(0, 1 - z / 160);\n    ell(g.x, g.y, 26 * k.scale * s * (.5 + .5 * t), 7 * k.scale * s * (.5 + .5 * t), 0, `rgba(30, 60, 25, ${.1 + .2 * t})`);\n\n    const sq = k.squash > 0 ? Math.sin(k.squash / .14 * Math.PI) * .12 : 0;\n    const hop = k.onGround ? Math.abs(Math.sin(clock * 9 + k.scale * 3)) * 3 : 0;\n    const sc = k.scale * s * .95;\n    ctx.save();\n    ctx.translate(g.x, g.y - (z + hop) * s - 27 * sc);\n    ctx.scale(sc * (1 + sq), sc * (1 - sq));\n\n    // 꼬리 (카메라 쪽으로 뻗음)\n    ctx.fillStyle = FUR_D;\n    ctx.beginPath();\n    ctx.moveTo(-7, 14); ctx.quadraticCurveTo(-5, 34, 0, 46); ctx.quadraticCurveTo(5, 34, 7, 14);\n    ctx.closePath(); ctx.fill();\n    // 큰 뒷발\n    ell(-15, 18, 7, 11, 0.1, FUR_D);\n    ell(15, 18, 7, 11, -0.1, FUR_D);\n    // 몸통\n    ell(0, 0, 19, 26, 0, FUR);\n    ell(0, -4, 9, 16, 0, \"rgba(255,255,255,.12)\");\n    // 앞발 (살짝 보임)\n    ell(-17, -12, 4, 7, 0.4, FUR_D);\n    ell(17, -12, 4, 7, -0.4, FUR_D);\n    // 머리 뒤통수 + 귀\n    ell(0, -32, 13, 12, 0, FUR);\n    ell(-8, -48, 4.8, 12, -0.3, FUR);\n    ell(8, -48, 4.8, 12, 0.3, FUR);\n    ell(-8, -47, 2.2, 8, -0.3, PINK);\n    ell(8, -47, 2.2, 8, 0.3, PINK);\n    // 주둥이 끝이 살짝 보임\n    ell(0, -26, 6, 3, 0, BELLY);\n\n    if (k.hurt) {\n      ctx.font = \"18px sans-serif\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\";\n      ctx.fillText(\"💫\", 0, -68);\n    }\n    ctx.restore();\n  }\n\n  // ---------- 장애물 (정면에서 다가옴) ----------\n  function fadeFor(p) { return Math.max(0, Math.min(1, (p.D - 120) / 70)); }   // 캥거루를 지나치면 흐려짐\n\n  function drawFox(o, p) {\n    const ORANGE = \"#E8833A\", DARK = \"#B85F22\", WHITE = \"#FFF6EA\", INK = \"#2E1E14\";\n    const sc = o.s * .6 * p.s;\n    const step = Math.sin(clock * 18) * 3;\n    ell(p.x, p.y, 20 * sc, 5 * sc, 0, \"rgba(30,60,25,.22)\");\n    ctx.save();\n    ctx.translate(p.x, p.y);\n    ctx.rotate(Math.max(-.3, Math.min(.3, o.vside / 260)));\n    ctx.scale(sc, sc);\n    ell(16, -36, 7, 13, .6 + Math.sin(clock * 6) * .15, ORANGE);          // 꼬리\n    ell(22, -45, 4.5, 5, 0, WHITE);\n    ell(0, -22, 16, 14, 0, ORANGE);                                          // 몸\n    ell(-8, -6 + step, 3.5, 8, 0, DARK);                                     // 앞다리\n    ell(8, -6 - step, 3.5, 8, 0, DARK);\n    ctx.fillStyle = ORANGE;                                                  // 귀\n    ctx.beginPath(); ctx.moveTo(-13, -36); ctx.lineTo(-10, -54); ctx.lineTo(-2, -40); ctx.fill();\n    ctx.beginPath(); ctx.moveTo(13, -36); ctx.lineTo(10, -54); ctx.lineTo(2, -40); ctx.fill();\n    ctx.fillStyle = DARK;\n    ctx.beginPath(); ctx.moveTo(-10, -40); ctx.lineTo(-9, -49); ctx.lineTo(-5, -41); ctx.fill();\n    ctx.beginPath(); ctx.moveTo(10, -40); ctx.lineTo(9, -49); ctx.lineTo(5, -41); ctx.fill();\n    ell(0, -32, 14, 12, 0, ORANGE);                                          // 얼굴\n    ell(-7, -27, 6, 5, 0, WHITE);\n    ell(7, -27, 6, 5, 0, WHITE);\n    ell(0, -24, 5, 5, 0, WHITE);\n    ell(0, -27, 2.4, 2, 0, INK);                                             // 코\n    ell(-5, -35, 1.8, 2.2, 0, INK);                                          // 눈\n    ell(5, -35, 1.8, 2.2, 0, INK);\n    ctx.restore();\n  }\n\n  function drawEagle(o, p) {\n    const BROWN = \"#7A4E2D\", BROWN_D = \"#5A3820\", WHITE = \"#FFFFFF\", BEAK = \"#F5B82E\", INK = \"#1E140C\";\n    const z = GROUND_Y - o.y;\n    const ground = proj(o.x, o.side, 0);\n    const sc = o.s * .62 * p.s;\n    const flap = Math.sin(clock * 9 + o.phase);\n    // 땅의 그림자\n    ell(ground.x, ground.y, 36 * sc, 5 * sc, 0, `rgba(30,60,25,${z > 120 ? .1 : .2})`);\n    ctx.save();\n    ctx.translate(p.x, p.y);\n    ctx.rotate(Math.max(-.35, Math.min(.35, o.vside / 160)));   // 옆으로 날 때 날개를 기울임\n    ctx.scale(sc, sc);\n    // 날개 (끝이 위아래로 퍼덕)\n    ctx.fillStyle = BROWN_D;\n    ctx.beginPath();\n    ctx.moveTo(-6, -4);\n    ctx.quadraticCurveTo(-28, -10 - flap * 10, -54, -6 - flap * 24);\n    ctx.lineTo(-46, 0 - flap * 18); ctx.lineTo(-50, 4 - flap * 16); ctx.lineTo(-36, 4 - flap * 10);\n    ctx.quadraticCurveTo(-20, 6, -6, 6);\n    ctx.lineTo(6, 6);\n    ctx.quadraticCurveTo(20, 6, 36, 4 - flap * 10);\n    ctx.lineTo(50, 4 - flap * 16); ctx.lineTo(46, 0 - flap * 18); ctx.lineTo(54, -6 - flap * 24);\n    ctx.quadraticCurveTo(28, -10 - flap * 10, 6, -4);\n    ctx.fill();\n    ctx.fillStyle = BROWN;\n    ctx.beginPath();\n    ctx.moveTo(-6, -2); ctx.quadraticCurveTo(-24, -6 - flap * 8, -38, -2 - flap * 16); ctx.quadraticCurveTo(-20, 4, -6, 4);\n    ctx.moveTo(6, -2); ctx.quadraticCurveTo(24, -6 - flap * 8, 38, -2 - flap * 16); ctx.quadraticCurveTo(20, 4, 6, 4);\n    ctx.fill();\n    // 몸 + 꼬리 + 발\n    ell(0, 2, 9, 12, 0, BROWN);\n    ctx.fillStyle = WHITE;\n    ctx.beginPath(); ctx.moveTo(-6, 10); ctx.lineTo(0, 22); ctx.lineTo(6, 10); ctx.fill();\n    ell(-4, 14, 2, 3, 0, BEAK);\n    ell(4, 14, 2, 3, 0, BEAK);\n    // 흰 머리 + 노란 부리 (정면)\n    ell(0, -10, 8, 8, 0, WHITE);\n    ctx.fillStyle = BEAK;\n    ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(0, -1); ctx.lineTo(3, -8); ctx.fill();\n    ell(-3.5, -12, 1.5, 1.5, 0, INK);\n    ell(3.5, -12, 1.5, 1.5, 0, INK);\n    ctx.restore();\n  }\n\n  function drawWorld() {\n    // 멀리 있는 것부터 가까운 순서로 그리기\n    const items = [];\n    SCENERY.forEach(it => {\n      const d = sceneryDist(it);\n      const p = proj(d, it.lateral, 0);\n      if (p.D > 50) items.push({ D: p.D, draw: () => drawScenery(it, p) });\n    });\n    obstacles.forEach(o => {\n      const z = o.type === \"eagle\" ? GROUND_Y - o.y : 0;\n      const p = proj(o.x, o.side, z);\n      if (p.D > 30) items.push({ D: p.D - (o.type === \"eagle\" ? .5 : 0), draw: () => {\n        ctx.globalAlpha = fadeFor(p);\n        o.type === \"fox\" ? drawFox(o, p) : drawEagle(o, p);\n        ctx.globalAlpha = 1;\n      } });\n    });\n    const lead = proj(kangaroo.x, kangaroo.side, 0);\n    items.push({ D: lead.D + .1, draw: () => drawKangaroo(kangaroo, kangaroo.side, kangaroo.x) });\n    family.forEach((f, i) => {\n      const p = proj(f.x, FAMILY_SPOTS[i].side, 0);\n      items.push({ D: p.D, draw: () => drawKangaroo(f, FAMILY_SPOTS[i].side, f.x) });\n    });\n    items.sort((a, b) => b.D - a.D).forEach(it => it.draw());\n  }\n\n  // ---------- 화면 위 표시 ----------\n  function pill(x, y, w, h) {\n    ctx.beginPath();\n    ctx.roundRect(x, y, w, h, h / 2);\n    ctx.fillStyle = \"rgba(255, 255, 255, .9)\";\n    ctx.fill();\n    ctx.strokeStyle = \"#5FA84A\";\n    ctx.lineWidth = 2;\n    ctx.stroke();\n  }\n\n  function drawFamilyHud() {\n    const x = 12, y = 12, w = 150, h = 34;\n    pill(x, y, w, h);\n    ctx.font = '15px \"Jua\", sans-serif';\n    ctx.textAlign = \"left\";\n    ctx.textBaseline = \"middle\";\n    ctx.fillStyle = \"#2F4A2A\";\n    ctx.fillText(\"가족 \" + (1 + stagesDone) + \"/4\", x + 13, y + h / 2 + 1);\n    const bx = x + 70, bw = w - 82, by = y + h / 2 - 4;\n    const prev = stagesDone ? STAGE_TIMES[stagesDone - 1] : 0;\n    const next = STAGE_TIMES[Math.min(stagesDone, STAGE_TIMES.length - 1)];\n    const t = stagesDone >= STAGE_TIMES.length ? 1 : Math.max(0, Math.min(1, (runTime - prev) / (next - prev)));\n    ctx.fillStyle = \"#E3F1DA\";\n    ctx.beginPath(); ctx.roundRect(bx, by, bw, 8, 4); ctx.fill();\n    ctx.fillStyle = \"#F2A93B\";\n    ctx.beginPath(); ctx.roundRect(bx, by, Math.max(8, bw * t), 8, 4); ctx.fill();\n  }\n\n  function drawScore() {\n    const text = \"SCORE \" + String(Math.floor(score)).padStart(5, \"0\");\n    ctx.font = '16px \"Jua\", sans-serif';\n    ctx.textAlign = \"right\";\n    ctx.textBaseline = \"middle\";\n    const w = ctx.measureText(text).width + 26;\n    pill(W - 12 - w, 12, w, 34);\n    ctx.fillStyle = \"#2F4A2A\";\n    ctx.fillText(text, W - 25, 30);\n  }\n\n  function drawBanner() {\n    if (!banner) return;\n    const total = banner.total || (banner.total = banner.life);\n    const a = Math.min(1, banner.life / .4, (total - banner.life) / .25);\n    ctx.globalAlpha = Math.max(0, a);\n    ctx.textAlign = \"center\";\n    ctx.textBaseline = \"middle\";\n    const lines = banner.text;\n    ctx.font = '17px \"Jua\", sans-serif';\n    const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 36;\n    const h = 22 * lines.length + 18;\n    const y = 74 - (1 - Math.min(1, (total - banner.life) / .25)) * 10;\n    ctx.beginPath();\n    ctx.roundRect(W / 2 - w / 2, y, w, h, 18);\n    ctx.fillStyle = \"#FFFFFF\";\n    ctx.fill();\n    ctx.strokeStyle = \"#F2A93B\";\n    ctx.lineWidth = 3;\n    ctx.stroke();\n    ctx.fillStyle = \"#2F4A2A\";\n    lines.forEach((l, i) => ctx.fillText(l, W / 2, y + 20 + i * 22));\n    ctx.globalAlpha = 1;\n  }\n\n  function draw() {\n    drawSky();\n    drawGround();\n    drawWorld();\n    drawFamilyHud();\n    drawScore();\n    drawBanner();\n  }\n\n  // ---------- 🌿 초원으로 피하기 ----------\n  function updateDodgeUi() {\n    dodgeCountEl.textContent = dodgeCharges;\n    const usable = dodgeCharges > 0 && !gameOver && !won;\n    dodgeBtn.disabled = !usable;\n    dodgeBtn.classList.toggle(\"ready\", usable);\n  }\n\n  // 시작 후 경과 시간 → 옆으로 비켜선 정도 (0 ~ 1)\n  function dodgeAmount(t) {\n    if (t < 0 || t > DODGE_TIME) return 0;\n    const inOut = .22;\n    if (t < inOut) return t / inOut;\n    if (t > DODGE_TIME - inOut) return (DODGE_TIME - t) / inOut;\n    return 1;\n  }\n\n  function sideOf(k) {\n    const d = k.dodges[0];\n    if (!d) return 0;\n    const t = runTime - d.start;\n    return d.dir * DODGE_SIDE * (1 - Math.pow(1 - dodgeAmount(t), 2));\n  }\n\n  function dodge(dir) {\n    if (gameOver || won || dodgeCharges <= 0 || kangaroo.dodges.length) return;\n    dir = dir || nextDodgeDir;\n    nextDodgeDir = -dir;\n    dodgeCharges--;\n    updateDodgeUi();\n    kangaroo.dodges.push({ start: runTime, dir });\n  }\n\n  function updateDodges() {\n    [kangaroo, ...family].forEach(k => {\n      if (k.dodges.length && runTime - k.dodges[0].start > DODGE_TIME) k.dodges.shift();\n      k.side = sideOf(k);\n    });\n  }\n\n  // 독수리가 캥거루 뒤로 무사히 지나가면 1번 피한 것\n  function countEagles() {\n    obstacles.forEach(o => {\n      if (o.type !== \"eagle\" || o.counted) return;\n      if (o.x + o.w < kangaroo.x - 12) {\n        o.counted = true;\n        eaglesDodged++;\n        if (eaglesDodged % EAGLES_PER_DODGE === 0) {\n          dodgeCharges++;\n          updateDodgeUi();\n          if (!banner) banner = { text: [\"독수리를 2번 피했어요! 🦅\", \"🌿 초원으로 피하기 +1\"], life: 2.2 };\n        }\n      }\n    });\n  }\n\n  // ---------- 점프 / 가족 ----------\n  function jump() {\n    if (gameOver || won || !kangaroo.onGround) return;   // 공중에서는 다시 점프 불가\n    kangaroo.vy = -JUMP_SPEED;\n    kangaroo.onGround = false;\n    family.forEach((f, i) => f.jumps.push(runTime + .07 * (i + 1)));   // 가족도 차례로 폴짝\n  }\n\n  function moveBody(k, dt) {\n    if (!k.onGround) {\n      k.vy += GRAVITY * dt;\n      k.y += k.vy * dt;\n      if (k.y >= GROUND_Y) { k.y = GROUND_Y; k.vy = 0; k.onGround = true; k.squash = .14; }\n    }\n    if (k.squash > 0) k.squash = Math.max(0, k.squash - dt);\n  }\n\n  function updateFamily(dt) {\n    family.forEach((f, i) => {\n      const target = kangaroo.x + FAMILY_SPOTS[i].ahead;\n      f.x += (target - f.x) * Math.min(1, dt * 2.5);\n      if (f.jumps.length && runTime >= f.jumps[0]) {\n        f.jumps.shift();\n        if (f.onGround) { f.vy = -JUMP_SPEED; f.onGround = false; }\n      }\n      moveBody(f, dt);\n    });\n    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }\n  }\n\n  function stageClear() {\n    const m = NEW_MEMBERS[stagesDone];\n    stagesDone++;\n    family.push({ x: kangaroo.x - 220, y: GROUND_Y, vy: -JUMP_SPEED * .7, onGround: false, squash: 0,\n                  scale: m.scale, fur: m.fur, jumps: [], dodges: [], side: 0 });\n    banner = { text: [`${stagesDone}단계 성공! 🦘`, `${m.name}가 함께 달려요`], life: 2.6 };\n    if (stagesDone === STAGE_TIMES.length) setTimeout(winGame, 1300);\n  }\n\n  // ---------- 충돌 (거리 + 높이로 판정) ----------\n  function kangarooBoxes() {\n    const k = kangaroo, sc = k.scale;\n    return [\n      { x1: k.x - 8 * sc, x2: k.x + 22 * sc, y1: k.y - 72 * sc, y2: k.y - 2 },\n      { x1: k.x + 8 * sc, x2: k.x + 42 * sc, y1: k.y - 104 * sc, y2: k.y - 72 * sc }\n    ];\n  }\n  function obstacleBox(o) {\n    const s = o.s;\n    if (o.type === \"fox\")   return { x1: o.x + 4 * s, x2: o.x + 46 * s, y1: o.y - 30 * s, y2: o.y };\n    return { x1: o.x + 4 * s, x2: o.x + 56 * s, y1: o.y - 10 * s, y2: o.y + 9 * s };   // 독수리\n  }\n  function hits(a, b, pad = 3) {\n    return a.x1 + pad < b.x2 && a.x2 - pad > b.x1 && a.y1 + pad < b.y2 && a.y2 - pad > b.y1;\n  }\n  function checkCrash() {\n    const mine = kangarooBoxes();\n    return obstacles.some(o => {\n      // 좌우로 비껴 있으면 안 부딪힘 (독수리는 날개 끝은 봐줌)\n      const half = o.type === \"fox\" ? 9.6 * o.s : 20 * o.s;\n      if (Math.abs(o.side - kangaroo.side) >= half + 22) return false;\n      const box = obstacleBox(o);\n      return mine.some(m => hits(m, box));\n    });\n  }\n\n  // ---------- 결과 창 ----------\n  const overEl = document.getElementById(\"over\");\n  const overCard = document.querySelector(\".over-card\");\n  function showResult({ emoji, title, msg, button, win }) {\n    document.getElementById(\"overEmoji\").textContent = emoji;\n    document.getElementById(\"overTitle\").textContent = title;\n    document.getElementById(\"overMsg\").textContent = msg;\n    document.getElementById(\"againBtn\").textContent = button;\n    overCard.classList.toggle(\"win\", !!win);\n    document.getElementById(\"record\").textContent = Math.floor(score);\n  }\n  function openResult(delay) {\n    setTimeout(() => {\n      overEl.classList.add(\"show\");\n      document.getElementById(\"againBtn\").focus();\n    }, delay);\n  }\n\n  function winGame() {\n    if (gameOver) return;\n    won = true;\n    obstacles.length = 0;\n    updateDodgeUi();\n    showResult({ emoji: \"🦘🦘🦘🦘\", title: \"축하합니다!\", msg: \"따뜻한 캥거루 가족이 탄생했어요 😄\", button: \"다시 달려요!\", win: true });\n    openResult(600);\n  }\n\n  function endGame() {\n    if (won) return;\n    gameOver = true;\n    kangaroo.hurt = true;\n    updateDodgeUi();\n    showResult({ emoji: \"💫\", title: \"게임 오버!\", msg: stagesDone ? `캥거루 가족 ${1 + stagesDone}마리까지 모였어요` : \"\", button: \"다시 하기\" });\n    openResult(350);\n  }\n\n  function restart() {\n    obstacles.length = 0;\n    spawnTimer = 1.2;\n    score = 0;\n    gameOver = false;\n    won = false;\n    runTime = 0;\n    stagesDone = 0;\n    family = [];\n    banner = null;\n    Object.assign(kangaroo, { x: 120, y: GROUND_Y, vy: 0, onGround: true, squash: 0, hurt: false, side: 0, dodges: [] });\n    eaglesDodged = 0;\n    dodgeCharges = 0;\n    updateDodgeUi();\n    overEl.classList.remove(\"show\");\n    window.focus();\n  }\n  document.getElementById(\"againBtn\").addEventListener(\"click\", restart);\n\n  // ---------- 매 프레임 ----------\n  function update(dt) {\n    if (gameOver) return;\n    if (won) { clock += dt; updateFamily(dt); moveBody(kangaroo, dt); return; }\n    runTime += dt;\n    score += SCORE_PER_SEC * speedMult() * dt;\n    if (stagesDone < STAGE_TIMES.length && runTime >= STAGE_TIMES[stagesDone]) stageClear();\n    updateObstacles(dt);\n    updateFamily(dt);\n    updateDodges();\n    moveBody(kangaroo, dt);\n    if (checkCrash()) endGame();\n    else countEagles();\n  }\n\n  window.addEventListener(\"keydown\", e => {\n    if (e.code === \"Space\" || e.key === \" \") {\n      if (e.target.tagName === \"BUTTON\" || e.target.tagName === \"A\") return;\n      e.preventDefault();\n      if (!e.repeat) jump();\n    }\n  });\n  canvas.addEventListener(\"pointerdown\", e => { e.preventDefault(); jump(); });\n  window.addEventListener(\"keydown\", e => {\n    if (e.key === \"ArrowLeft\")  { e.preventDefault(); dodge(-1); }\n    if (e.key === \"ArrowRight\") { e.preventDefault(); dodge(1); }\n  });\n  dodgeBtn.addEventListener(\"click\", () => { dodge(); dodgeBtn.blur(); });\n\n  let last = performance.now();\n  function loop(now) {\n    const dt = Math.min((now - last) / 1000, 0.033);\n    last = now;\n    update(dt);\n    draw();\n    requestAnimationFrame(loop);\n  }\n\n  fitCanvas();\n  window.addEventListener(\"resize\", fitCanvas);\n  requestAnimationFrame(loop);\n  window.focus();\n<\/script>\n<\/body>\n<\/html>\n"}];

  const list = document.getElementById("games");
  const player = document.getElementById("player");
  const frame = document.getElementById("frame");

  GAMES.forEach((g, i) => {
    const el = document.createElement("article");
    el.className = "game";
    el.innerHTML = `
      <div class="thumb" style="background:${g.color}">${g.emoji}</div>
      <div class="info"><h2>${g.title}</h2><p>${g.desc}</p></div>
      <button class="go" style="background:${g.color}">게임장 이동하기</button>`;
    el.querySelector(".go").addEventListener("click", () => openGame(i));
    list.appendChild(el);
  });

  function openGame(i) {
    frame.srcdoc = GAMES[i].html;
    frame.onload = () => { try { frame.contentWindow.focus(); } catch (e) {} };
    player.classList.add("show");
    document.body.style.overflow = "hidden";
    history.pushState({ game: i }, "");
  }
  function closeGame() {
    player.classList.remove("show");
    frame.srcdoc = "";
    document.body.style.overflow = "";
  }
  window.addEventListener("message", e => {
    if (e.data === "go-home") history.state && history.state.game !== undefined ? history.back() : closeGame();
  });
  // 휴대폰 뒤로가기 버튼으로도 게임장으로 돌아옴
  window.addEventListener("popstate", closeGame);
</script>
