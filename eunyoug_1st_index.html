<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게임장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2B2350;
    --bg2: #3B2F6B;
    --ink: #1C1638;
    --lemon: #FFE45C;
    --pink: #FF6FA8;
    --grass: #9DB38A;
    --text: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 0%, var(--bg2) 0%, transparent 55%),
      radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.5px) 0 0 / 20px 20px,
      var(--bg);
    display: flex;
    justify-content: center;
    padding: 36px 18px 48px;
  }
  .lobby { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 30px; }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 3.6rem);
    color: var(--lemon);
    text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 var(--ink);
  }
  header p { margin: 10px 0 0; opacity: .75; font-size: 1.05rem; }

  .games { display: grid; gap: 16px; }
  .game {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    border-radius: 20px;
    background: rgba(255,255,255,.06);
    border: 2px solid rgba(255,255,255,.12);
  }
  .thumb {
    flex: none;
    width: 76px; height: 76px;
    border-radius: 18px;
    display: grid; place-items: center;
    font-size: 2.4rem;
    border: 3px solid var(--ink);
  }
  .info { flex: 1; min-width: 0; }
  .info h2 { margin: 0; font-weight: 400; font-size: 1.45rem; }
  .info p { margin: 4px 0 0; opacity: .72; font-size: .95rem; line-height: 1.4; }
  .go {
    flex: none;
    font-family: inherit;
    font-size: 1.05rem;
    color: var(--ink);
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 14px;
    border: 3px solid var(--ink);
    box-shadow: 0 5px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
    white-space: nowrap;
  }
  .go:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .go:focus-visible { outline: 3px dashed var(--lemon); outline-offset: 4px; }

  @media (max-width: 420px) {
    .game { flex-wrap: wrap; }
    .go { width: 100%; text-align: center; }
  }
  .player {
    position: fixed; inset: 0;
    z-index: 20;
    display: none;
    background: #fff;
  }
  .player.show { display: block; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  button.go { cursor: pointer; }

  @media (prefers-reduced-motion: reduce) { .go { transition: none; } }
</style>
</head>
<body>
<main class="lobby">
  <header>
    <h1>게임장</h1>
    <p>하고 싶은 게임을 골라주세요</p>
  </header>

  <section class="games" id="games"></section>
</main>

<div class="player" id="player"><iframe id="frame" title="게임"></iframe></div>

<script>

  const GAMES = [{"file": "Rps.html", "emoji": "✌️", "color": "#FF6FA8", "title": "가위 바위 보", "desc": "컴퓨터와 대결! 먼저 5점을 따면 승리", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>가위 바위 보 !<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --bg: #FFF4D6;\n    --dot: #FFD98A;\n    --ink: #3B2A6B;\n    --pink: #FF6FA8;\n    --pink-d: #D9457F;\n    --sky: #52C7F5;\n    --sky-d: #2A9AD0;\n    --mint: #5FD9A0;\n    --mint-d: #2FAE74;\n    --lemon: #FFE45C;\n    --panel: #FFFFFF;\n    box-sizing: border-box;\n    padding-top: env(safe-area-inset-top, 0px);\n    padding-bottom: env(safe-area-inset-bottom, 0px);\n  }\n  *, *::before, *::after { box-sizing: inherit; }\n  html { scroll-padding-top: env(safe-area-inset-top, 0px); }\n  body {\n    margin: 0;\n    min-height: 100vh;\n    font-family: \"Jua\", \"Apple SD Gothic Neo\", \"Malgun Gothic\", sans-serif;\n    color: var(--ink);\n    background-color: var(--bg);\n    background-image: radial-gradient(var(--dot) 2.5px, transparent 2.5px);\n    background-size: 22px 22px;\n    display: flex;\n    justify-content: center;\n    padding: 24px 16px 40px;\n  }\n  .machine {\n    width: 100%;\n    max-width: 520px;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 22px;\n  }\n\n  .home {\n    align-self: flex-start;\n    font-size: 1rem;\n    color: var(--ink);\n    text-decoration: none;\n    background: var(--panel);\n    border: 3px solid var(--ink);\n    border-radius: 999px;\n    padding: 6px 14px;\n    box-shadow: 0 4px 0 var(--ink);\n    margin-bottom: -8px;\n  }\n  .home:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }\n  .home:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }\n\n  /* 제목: 오락실 간판 */\n  .marquee {\n    position: relative;\n    width: 100%;\n    background: var(--ink);\n    border-radius: 22px;\n    padding: 18px 12px 20px;\n    text-align: center;\n    box-shadow: 0 8px 0 #24184A;\n  }\n  .marquee::before {\n    content: \"\";\n    position: absolute;\n    inset: 8px;\n    border-radius: 16px;\n    border: 4px dotted var(--lemon);\n    animation: blink 1.2s steps(2) infinite;\n    pointer-events: none;\n  }\n  @keyframes blink { 50% { border-color: var(--pink); } }\n  .marquee h1 {\n    margin: 0;\n    font-weight: 400;\n    font-size: clamp(2.2rem, 9vw, 3.4rem);\n    letter-spacing: 0.04em;\n    color: var(--lemon);\n    text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 #24184A;\n  }\n\n  /* 점수판 */\n  .scoreboard {\n    width: 100%;\n    display: grid;\n    grid-template-columns: 1fr auto 1fr;\n    align-items: center;\n    background: var(--panel);\n    border: 4px solid var(--ink);\n    border-radius: 18px;\n    padding: 12px 14px;\n    box-shadow: 0 6px 0 var(--ink);\n  }\n  .side { text-align: center; }\n  .side .who { font-size: 1.05rem; }\n  .side .num { font-size: 2.6rem; line-height: 1.1; }\n  .side.me .num { color: var(--pink-d); }\n  .side.cpu .num { color: var(--sky-d); }\n  .pips { display: flex; justify-content: center; gap: 5px; margin-top: 4px; }\n  .pip {\n    width: 14px; height: 14px; border-radius: 50%;\n    border: 2.5px solid var(--ink);\n    background: transparent;\n    transition: background .2s, transform .2s;\n  }\n  .me .pip.on { background: var(--pink); transform: scale(1.15); }\n  .cpu .pip.on { background: var(--sky); transform: scale(1.15); }\n  .vs {\n    font-size: 1.1rem;\n    background: var(--lemon);\n    border: 3px solid var(--ink);\n    border-radius: 50%;\n    width: 46px; height: 46px;\n    display: grid; place-items: center;\n  }\n  .goal { font-size: .95rem; margin-top: -10px; opacity: .8; }\n\n  /* 버튼 */\n  .buttons {\n    width: 100%;\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 14px;\n  }\n  .rps {\n    font-family: inherit;\n    color: var(--ink);\n    border: 4px solid var(--ink);\n    border-radius: 50%;\n    aspect-ratio: 1;\n    width: 100%;\n    cursor: pointer;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    gap: 2px;\n    font-size: 1.15rem;\n    transition: transform .08s, box-shadow .08s;\n    -webkit-tap-highlight-color: transparent;\n  }\n  .rps .emo { font-size: clamp(2.4rem, 11vw, 3.6rem); line-height: 1; }\n  .rps.scissors { background: var(--pink); box-shadow: 0 9px 0 var(--pink-d), 0 9px 0 4px var(--ink); }\n  .rps.rock     { background: var(--sky);  box-shadow: 0 9px 0 var(--sky-d), 0 9px 0 4px var(--ink); }\n  .rps.paper    { background: var(--mint); box-shadow: 0 9px 0 var(--mint-d), 0 9px 0 4px var(--ink); }\n  .rps:hover:not(:disabled) { transform: translateY(-2px); }\n  .rps:active:not(:disabled) { transform: translateY(8px); box-shadow: 0 1px 0 var(--ink), 0 1px 0 4px var(--ink); }\n  .rps:focus-visible { outline: 4px dashed var(--ink); outline-offset: 6px; }\n  .rps:disabled { filter: grayscale(.6); opacity: .6; cursor: not-allowed; }\n\n  /* 결과 영역 */\n  .result {\n    width: 100%;\n    min-height: 190px;\n    background: var(--panel);\n    border: 4px dashed var(--ink);\n    border-radius: 18px;\n    padding: 16px;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    gap: 10px;\n    text-align: center;\n  }\n  .result .hint { opacity: .55; font-size: 1.1rem; }\n  .duel { display: flex; align-items: center; gap: 18px; }\n  .hand { display: flex; flex-direction: column; align-items: center; font-size: .95rem; }\n  .hand .big { font-size: 3.2rem; line-height: 1.15; }\n  .duel .vs-small { font-size: 1.3rem; opacity: .6; }\n  .verdict { font-size: 1.7rem; }\n  .verdict .face { font-size: 2.2rem; vertical-align: middle; margin-right: 6px; }\n  .verdict.win  { color: var(--pink-d); }\n  .verdict.lose { color: var(--sky-d); }\n  .verdict.draw { color: #B08A00; }\n  .pop { animation: pop .35s cubic-bezier(.3,1.6,.6,1); }\n  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n  .shake { animation: shake .4s ease-in-out; }\n  @keyframes shake {\n    0%,100% { transform: rotate(0); }\n    25% { transform: rotate(-14deg); }\n    75% { transform: rotate(14deg); }\n  }\n\n  /* 최종 승리 팝업 */\n  .overlay {\n    position: fixed; inset: 0;\n    background: rgba(59, 42, 107, .55);\n    display: none;\n    align-items: center; justify-content: center;\n    padding: 20px;\n    z-index: 10;\n  }\n  .overlay.show { display: flex; }\n  .card {\n    background: var(--lemon);\n    border: 5px solid var(--ink);\n    border-radius: 26px;\n    padding: 28px 24px 26px;\n    text-align: center;\n    max-width: 360px; width: 100%;\n    box-shadow: 0 10px 0 var(--ink);\n    animation: pop .45s cubic-bezier(.3,1.6,.6,1);\n  }\n  .card .trophy { font-size: 4.5rem; line-height: 1; }\n  .card h2 { margin: 10px 0 6px; font-weight: 400; font-size: 2rem; }\n  .card p { margin: 0 0 20px; font-size: 1.15rem; }\n  .again {\n    font-family: inherit;\n    font-size: 1.4rem;\n    color: #fff;\n    background: var(--pink);\n    border: 4px solid var(--ink);\n    border-radius: 999px;\n    padding: 12px 34px;\n    cursor: pointer;\n    box-shadow: 0 6px 0 var(--ink);\n    transition: transform .08s, box-shadow .08s;\n  }\n  .again:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }\n  .again:focus-visible { outline: 4px dashed var(--ink); outline-offset: 5px; }\n\n  .confetti {\n    position: fixed; top: -20px;\n    font-size: 1.6rem;\n    pointer-events: none;\n    z-index: 11;\n    animation: fall linear forwards;\n  }\n  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }\n\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before { animation: none !important; transition: none !important; }\n  }\n<\/style>\n<\/head>\n<body>\n<main class=\"machine\">\n  <a class=\"home\" href=\"#\" onclick=\"parent.postMessage('go-home', '*'); return false;\">🏠 게임장으로<\/a>\n  <header class=\"marquee\"><h1>가위 바위 보 !<\/h1><\/header>\n\n  <section class=\"scoreboard\" aria-label=\"점수판\">\n    <div class=\"side me\">\n      <div class=\"who\">🙋 나<\/div>\n      <div class=\"num\" id=\"meScore\">0<\/div>\n      <div class=\"pips\" id=\"mePips\"><\/div>\n    <\/div>\n    <div class=\"vs\">VS<\/div>\n    <div class=\"side cpu\">\n      <div class=\"who\">🤖 컴퓨터<\/div>\n      <div class=\"num\" id=\"cpuScore\">0<\/div>\n      <div class=\"pips\" id=\"cpuPips\"><\/div>\n    <\/div>\n  <\/section>\n  <div class=\"goal\">먼저 5점을 따면 최종 승리!<\/div>\n\n  <section class=\"buttons\">\n    <button class=\"rps scissors\" data-pick=\"scissors\" aria-label=\"가위\"><span class=\"emo\">✌️<\/span>가위<\/button>\n    <button class=\"rps rock\" data-pick=\"rock\" aria-label=\"바위\"><span class=\"emo\">✊<\/span>바위<\/button>\n    <button class=\"rps paper\" data-pick=\"paper\" aria-label=\"보\"><span class=\"emo\">🖐️<\/span>보<\/button>\n  <\/section>\n\n  <section class=\"result\" id=\"result\" aria-live=\"polite\">\n    <div class=\"hint\">버튼을 눌러 시작해요 🎮<\/div>\n  <\/section>\n<\/main>\n\n<div class=\"overlay\" id=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"endTitle\">\n  <div class=\"card\">\n    <div class=\"trophy\" id=\"endEmoji\">🏆<\/div>\n    <h2 id=\"endTitle\">최종 승리!<\/h2>\n    <p id=\"endMsg\"><\/p>\n    <button class=\"again\" id=\"againBtn\">다시하기<\/button>\n  <\/div>\n<\/div>\n\n<script>\n  const WIN_SCORE = 5;\n  const HANDS = {\n    scissors: { emo: \"✌️\", name: \"가위\", beats: \"paper\" },\n    rock:     { emo: \"✊\",  name: \"바위\", beats: \"scissors\" },\n    paper:    { emo: \"🖐️\", name: \"보\",   beats: \"rock\" }\n  };\n  const KEYS = Object.keys(HANDS);\n\n  let me = 0, cpu = 0, over = false;\n\n  const $ = id => document.getElementById(id);\n  const buttons = document.querySelectorAll(\".rps\");\n  const resultEl = $(\"result\");\n\n  function buildPips() {\n    [\"mePips\", \"cpuPips\"].forEach(id => {\n      $(id).innerHTML = \"\";\n      for (let i = 0; i < WIN_SCORE; i++) {\n        const p = document.createElement(\"span\");\n        p.className = \"pip\";\n        $(id).appendChild(p);\n      }\n    });\n  }\n\n  function renderScore() {\n    $(\"meScore\").textContent = me;\n    $(\"cpuScore\").textContent = cpu;\n    $(\"mePips\").querySelectorAll(\".pip\").forEach((p, i) => p.classList.toggle(\"on\", i < me));\n    $(\"cpuPips\").querySelectorAll(\".pip\").forEach((p, i) => p.classList.toggle(\"on\", i < cpu));\n  }\n\n  function play(pick) {\n    if (over) return;\n    const com = KEYS[Math.floor(Math.random() * KEYS.length)];\n\n    let cls, face, text;\n    if (pick === com) {\n      cls = \"draw\"; face = \"😮\"; text = \"비겼다!\";\n    } else if (HANDS[pick].beats === com) {\n      cls = \"win\"; face = \"🥳\"; text = \"이겼다!\"; me++;\n    } else {\n      cls = \"lose\"; face = \"😭\"; text = \"졌다…\"; cpu++;\n    }\n\n    resultEl.innerHTML = `\n      <div class=\"duel\">\n        <div class=\"hand\"><span class=\"big shake\">${HANDS[pick].emo}<\/span>나<\/div>\n        <span class=\"vs-small\">vs<\/span>\n        <div class=\"hand\"><span class=\"big shake\">${HANDS[com].emo}<\/span>컴퓨터<\/div>\n      <\/div>\n      <div class=\"verdict ${cls} pop\"><span class=\"face\">${face}<\/span>${text}<\/div>\n    `;\n    renderScore();\n\n    if (me >= WIN_SCORE || cpu >= WIN_SCORE) endGame(me >= WIN_SCORE);\n  }\n\n  function endGame(iWon) {\n    over = true;\n    buttons.forEach(b => b.disabled = true);\n    setTimeout(() => {\n      if (iWon) {\n        $(\"endEmoji\").textContent = \"🏆\";\n        $(\"endTitle\").textContent = \"최종 승리!\";\n        $(\"endMsg\").textContent = `축하해요! ${me} : ${cpu}로 컴퓨터를 이겼어요 🎉`;\n        confetti([\"🎉\",\"⭐\",\"🍬\",\"💖\",\"🎈\"]);\n      } else {\n        $(\"endEmoji\").textContent = \"🤖\";\n        $(\"endTitle\").textContent = \"컴퓨터 승리!\";\n        $(\"endMsg\").textContent = `아쉬워요! ${me} : ${cpu}… 다음엔 꼭 이길 수 있어요 💪`;\n        confetti([\"🤖\",\"⚡\",\"🔩\"]);\n      }\n      $(\"overlay\").classList.add(\"show\");\n      $(\"againBtn\").focus();\n    }, 700);\n  }\n\n  function confetti(set) {\n    if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n    for (let i = 0; i < 28; i++) {\n      const c = document.createElement(\"span\");\n      c.className = \"confetti\";\n      c.textContent = set[i % set.length];\n      c.style.left = Math.random() * 100 + \"vw\";\n      c.style.animationDuration = 2 + Math.random() * 2 + \"s\";\n      c.style.animationDelay = Math.random() * 0.8 + \"s\";\n      document.body.appendChild(c);\n      setTimeout(() => c.remove(), 5000);\n    }\n  }\n\n  function reset() {\n    me = 0; cpu = 0; over = false;\n    renderScore();\n    buttons.forEach(b => b.disabled = false);\n    resultEl.innerHTML = `<div class=\"hint pop\">새 게임 시작! 0 : 0 🎮<\/div>`;\n    $(\"overlay\").classList.remove(\"show\");\n    document.querySelectorAll(\".confetti\").forEach(c => c.remove());\n  }\n\n  buttons.forEach(b => b.addEventListener(\"click\", () => play(b.dataset.pick)));\n  $(\"againBtn\").addEventListener(\"click\", reset);\n\n  buildPips();\n  renderScore();\n<\/script>\n<\/body>\n<\/html>\n"}, {"file": "mole.html", "emoji": "🐰", "color": "#8FBF6F", "title": "토끼 잡기", "desc": "토끼를 3마리 놓치면 거북이 잡기로 바뀌어요!", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>토끼 잡기<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --sky: #DCE4EA;\n    --ink: #1F2A44;\n    --muted: #5C6B82;\n    --grass: #8FBF6F;\n    --grass-d: #6FA152;\n    --soil: #8A6F5A;\n    --hole: #2E241F;\n    --gold: #E3B23C;\n    --gold-d: #C4952A;\n    --card: rgba(255,255,255,.72);\n    box-sizing: border-box;\n    padding-top: env(safe-area-inset-top, 0px);\n    padding-bottom: env(safe-area-inset-bottom, 0px);\n  }\n  *, *::before, *::after { box-sizing: inherit; }\n  html { scroll-padding-top: env(safe-area-inset-top, 0px); }\n  body {\n    margin: 0;\n    min-height: 100vh;\n    font-family: \"IBM Plex Sans KR\", \"Apple SD Gothic Neo\", \"Malgun Gothic\", sans-serif;\n    color: var(--ink);\n    background:\n      radial-gradient(ellipse 70% 20% at 15% 100%, #A8CF8A 99%, transparent 100%),\n      radial-gradient(ellipse 80% 26% at 90% 100%, #94C274 99%, transparent 100%),\n      radial-gradient(circle at 85% 8%, #FFF3B0 0 34px, transparent 36px),\n      linear-gradient(180deg, #BFE2F2 0%, #E6F4EC 70%, #DDEFD2 100%);\n    background-attachment: fixed;\n    display: flex;\n    justify-content: center;\n    padding: 28px 18px 40px;\n  }\n  .stage {\n    width: 100%;\n    max-width: 480px;\n    display: flex;\n    flex-direction: column;\n    gap: 22px;\n  }\n  h1 {\n    margin: 0;\n    font-family: \"Gowun Batang\", serif;\n    font-size: clamp(2rem, 8vw, 2.6rem);\n    letter-spacing: -0.01em;\n    text-align: center;\n  }\n\n  .home {\n    align-self: flex-start;\n    font-size: .92rem;\n    font-weight: 600;\n    color: var(--ink);\n    text-decoration: none;\n    background: var(--card);\n    border: 1px solid rgba(31,42,68,.15);\n    border-radius: 999px;\n    padding: 6px 14px;\n    margin-bottom: -10px;\n  }\n  .home:hover { background: #fff; }\n  .home:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }\n\n  /* 상단 바: 점수 · 시간 · 시작 버튼 */\n  .hud {\n    display: flex;\n    align-items: stretch;\n    gap: 10px;\n    background: var(--card);\n    backdrop-filter: blur(8px);\n    -webkit-backdrop-filter: blur(8px);\n    border: 1px solid rgba(31,42,68,.12);\n    border-radius: 18px;\n    padding: 10px;\n  }\n  .stat {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    padding: 4px 10px;\n    min-width: 0;\n  }\n  .stat + .stat { border-left: 1px solid rgba(31,42,68,.12); }\n  .stat .label { font-size: .78rem; color: var(--muted); white-space: nowrap; }\n  .stat .value {\n    font-size: 1.55rem;\n    font-weight: 600;\n    font-variant-numeric: tabular-nums;\n    line-height: 1.2;\n  }\n  .start {\n    font-family: inherit;\n    font-size: 1rem;\n    font-weight: 600;\n    color: var(--ink);\n    background: var(--gold);\n    border: none;\n    border-radius: 12px;\n    padding: 0 16px;\n    cursor: pointer;\n    box-shadow: inset 0 -3px 0 var(--gold-d);\n    transition: transform .1s, filter .15s;\n    white-space: nowrap;\n  }\n  .start:hover:not(:disabled) { filter: brightness(1.05); }\n  .start:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--gold-d); }\n  .start:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }\n  .start:disabled { opacity: .55; cursor: default; }\n\n  /* 3x3 구멍 */\n  .field {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: clamp(14px, 4vw, 24px);\n    padding: clamp(18px, 5vw, 28px);\n    position: relative;\n    background:\n      repeating-linear-gradient(90deg, transparent 0 18px, rgba(255,255,255,.08) 18px 36px),\n      linear-gradient(180deg, var(--grass) 0%, var(--grass-d) 100%);\n    border-radius: 28px;\n    padding-bottom: clamp(38px, 9vw, 46px);\n    box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 18px 40px -20px rgba(31,42,68,.45);\n  }\n  .hole {\n    position: relative;\n    aspect-ratio: 1;\n    border: none;\n    background: none;\n    padding: 0;\n    cursor: pointer;\n  }\n  /* 흙 둔덕 */\n  .hole::before {\n    content: \"\";\n    position: absolute;\n    left: 4%; right: 4%; bottom: 14%;\n    height: 42%;\n    border-radius: 50%;\n    background: radial-gradient(ellipse at 50% 30%, #A3876F 0%, var(--soil) 60%, #6F5847 100%);\n  }\n  /* 구멍 */\n  .hole::after {\n    content: \"\";\n    position: absolute;\n    left: 16%; right: 16%; bottom: 24%;\n    height: 24%;\n    border-radius: 50%;\n    background: radial-gradient(ellipse at 50% 70%, #45372F 0%, var(--hole) 55%, #17110E 100%);\n    box-shadow: inset 0 6px 8px rgba(0,0,0,.55);\n  }\n  .hole:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 16px; }\n  .hole::before, .hole::after { z-index: 0; }\n\n  /* 토끼: 구멍 가운데 선에서 잘려서 쏙 올라옴 */\n  .mole-wrap {\n    position: absolute;\n    left: 18%; right: 18%;\n    bottom: 36%;\n    height: 104%;\n    overflow: hidden;\n    z-index: 1;\n    pointer-events: none;\n  }\n  .mole {\n    position: absolute;\n    left: 6%; right: 6%; bottom: 0;\n    transform: translateY(105%);\n    transition: transform .16s cubic-bezier(.55,0,.85,.4);\n  }\n  .mole svg { display: block; width: 100%; height: auto; }\n  .hole.up .mole {\n    transform: translateY(8%);\n    transition: transform .28s cubic-bezier(.25,1.6,.5,1);\n  }\n  /* 잡혔을 때: 찌그러지며 쏙 들어감 */\n  .hole.hit .mole { animation: bonk .38s ease-in forwards; }\n  @keyframes bonk {\n    0%   { transform: translateY(8%) scale(1, 1); }\n    25%  { transform: translateY(14%) scale(1.15, .78); }\n    100% { transform: translateY(110%) scale(.9, 1); }\n  }\n  .burst {\n    position: absolute;\n    left: 50%; top: 34%;\n    width: 0; height: 0;\n    z-index: 2;\n    pointer-events: none;\n  }\n  .burst .dizzy {\n    position: absolute;\n    left: 0; top: 0;\n    font-size: 1.3rem;\n    line-height: 1;\n    transform: translate(-50%, -50%);\n    animation: dizzy .6s ease-out forwards;\n  }\n  .burst .dizzy.main {\n    font-size: 2.2rem;\n    animation: whirl .7s ease-out forwards;\n  }\n  .burst .plus {\n    position: absolute;\n    left: 0; top: -10px;\n    transform: translateX(-50%);\n    font-weight: 600;\n    font-size: 1.3rem;\n    color: #fff;\n    text-shadow: 0 2px 0 var(--ink);\n    white-space: nowrap;\n    animation: rise .7s ease-out forwards;\n  }\n  @keyframes dizzy {\n    from { transform: translate(-50%, -50%) scale(.3) rotate(0); opacity: 1; }\n    to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(200deg); opacity: 0; }\n  }\n  @keyframes whirl {\n    0%   { transform: translate(-50%, -50%) scale(.2) rotate(0); opacity: 0; }\n    30%  { transform: translate(-50%, -50%) scale(1.2) rotate(120deg); opacity: 1; }\n    100% { transform: translate(-50%, -90%) scale(1) rotate(360deg); opacity: 0; }\n  }\n  @keyframes rise { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -38px); opacity: 0; } }\n  .value.bump { animation: bump .25s ease-out; }\n  @keyframes bump { 50% { transform: scale(1.25); color: var(--gold-d); } }\n  .value { display: inline-block; transform-origin: left center; }\n\n  /* 게임 오버 화면 */\n  .overlay {\n    position: fixed; inset: 0;\n    z-index: 10;\n    display: none;\n    align-items: center; justify-content: center;\n    padding: 20px;\n    background: rgba(31, 42, 68, .45);\n    backdrop-filter: blur(4px);\n    -webkit-backdrop-filter: blur(4px);\n  }\n  .overlay.show { display: flex; animation: fade .25s ease-out; }\n  .result-card {\n    width: 100%; max-width: 340px;\n    background: #fff;\n    border-radius: 24px;\n    padding: 30px 24px 26px;\n    text-align: center;\n    box-shadow: 0 24px 50px -20px rgba(31,42,68,.6);\n    animation: lift .35s cubic-bezier(.25,1.4,.5,1);\n  }\n  .result-card .over {\n    margin: 0;\n    font-family: \"Gowun Batang\", serif;\n    font-size: 2rem;\n  }\n  .result-card .label { margin: 18px 0 2px; color: var(--muted); font-size: .9rem; }\n  .result-card .final {\n    font-size: 3.4rem;\n    font-weight: 600;\n    line-height: 1.1;\n    font-variant-numeric: tabular-nums;\n  }\n  .result-card .final small { font-size: 1.3rem; margin-left: 2px; }\n  .result-card .start { margin-top: 22px; padding: 14px 34px; font-size: 1.05rem; }\n  .hourglass {\n    font-size: 3rem;\n    line-height: 1;\n    display: inline-block;\n    margin-bottom: 6px;\n    animation: flip 2s ease-in-out infinite;\n  }\n  @keyframes flip {\n    0%, 35%   { transform: rotate(0); }\n    50%, 85%  { transform: rotate(180deg); }\n    100%      { transform: rotate(360deg); }\n  }\n  .escape-line { margin: 14px 0 4px; color: var(--muted); }\n  .escape-line b { color: var(--ink); font-size: 1.15rem; }\n  .turtle-line { margin: 0; font-size: .95rem; min-height: 1.2em; }\n\n  /* 거북이 말풍선 */\n  .track { z-index: 3; }\n  .turtle.cheer { animation: hop .45s ease-out; }\n  @keyframes hop { 40% { top: -10px; } }\n  .bubble {\n    position: absolute;\n    top: -8px;\n    transform: translate(-30%, -100%);\n    background: #fff;\n    color: var(--ink);\n    border: 2px solid var(--ink);\n    border-radius: 12px;\n    padding: 3px 9px;\n    font-size: .82rem;\n    font-weight: 600;\n    white-space: nowrap;\n    animation: bubble 1s ease-out forwards;\n  }\n  .bubble::after {\n    content: \"\";\n    position: absolute;\n    left: 22%; bottom: -7px;\n    width: 10px; height: 10px;\n    background: #fff;\n    border-right: 2px solid var(--ink);\n    border-bottom: 2px solid var(--ink);\n    transform: rotate(45deg);\n  }\n  @keyframes bubble {\n    0%   { opacity: 0; transform: translate(-30%, -80%) scale(.6); }\n    15%  { opacity: 1; transform: translate(-30%, -100%) scale(1.05); }\n    75%  { opacity: 1; transform: translate(-30%, -100%) scale(1); }\n    100% { opacity: 0; transform: translate(-30%, -130%) scale(1); }\n  }\n\n  /* 거북이 잡기 모드 */\n  .mole .turtle-svg { display: none; }\n  .field.turtle-mode .mole .rabbit-svg { display: none; }\n  .field.turtle-mode .mole .turtle-svg { display: block; }\n  .field.turtle-mode .hole.cat .mole .turtle-svg { display: none; }\n  h1.swap { animation: titleSwap .5s cubic-bezier(.25,1.5,.5,1); }\n  @keyframes titleSwap { from { transform: scale(.6) rotate(-6deg); opacity: 0; } }\n  .switch-banner {\n    position: absolute;\n    left: 50%; top: 50%;\n    z-index: 5;\n    width: max-content;\n    max-width: 86%;\n    padding: 14px 20px;\n    border-radius: 18px;\n    background: #fff;\n    color: var(--ink);\n    border: 3px solid var(--ink);\n    box-shadow: 0 8px 0 var(--ink);\n    text-align: center;\n    font-weight: 600;\n    font-size: 1.05rem;\n    line-height: 1.45;\n    pointer-events: none;\n    opacity: 0;\n    transform: translate(-50%, -50%) scale(.6);\n  }\n  .switch-banner.show { animation: banner 1.8s ease-out forwards; }\n  @keyframes banner {\n    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.6); }\n    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }\n    25%, 85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }\n    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }\n  }\n\n  /* 토끼 / 가면 고양이 전환 */\n  .mole .cat-svg { display: none; }\n  .hole.cat .mole .rabbit-svg { display: none; }\n  .hole.cat .mole .cat-svg { display: block; }\n  .burst .plus.minus { color: #FFE0E0; text-shadow: 0 2px 0 #B3263A; }\n  .hole.hit.cat .mole { animation: bonk .38s ease-in forwards; }\n\n  @keyframes fade { from { opacity: 0; } }\n  @keyframes lift { from { transform: translateY(20px) scale(.94); opacity: 0; } }\n  .field.locked .hole { cursor: default; }\n\n  @media (prefers-reduced-motion: reduce) {\n    .mole, .hole.up .mole { transition: none; }\n    .overlay.show, .result-card, .hourglass, .bubble, .turtle.cheer, h1.swap { animation: none; }\n    .switch-banner.show { animation: none; opacity: 1; transform: translate(-50%, -50%); }\n    .hole.hit .mole { animation-duration: .01s; }\n  }\n\n  /* 결승선과 거북이 */\n  .finish {\n    position: absolute;\n    top: 0; bottom: 0; right: 4px;\n    width: 10px;\n    background: conic-gradient(#fff 25%, var(--ink) 0 50%, #fff 0 75%, var(--ink) 0) 0 0 / 10px 10px;\n    opacity: .55;\n    pointer-events: none;\n  }\n  .finish::before {\n    content: \"🚩\";\n    position: absolute;\n    top: -26px; left: -4px;\n    font-size: 1.4rem;\n  }\n  .track {\n    position: absolute;\n    left: 18px; right: 46px; bottom: 8px;\n    height: 26px;\n    border-top: 2px dashed rgba(255,255,255,.55);\n    pointer-events: none;\n  }\n  .turtle {\n    position: absolute;\n    left: 0; top: 0;\n    font-size: 1.5rem;\n    line-height: 1;\n    transform: translateX(-50%) scaleX(-1);\n    transition: left 1s linear;\n  }\n\n  .note {\n    text-align: center;\n    color: var(--muted);\n    font-size: .92rem;\n  }\n<\/style>\n<\/head>\n<body>\n<main class=\"stage\">\n  <a class=\"home\" href=\"#\" onclick=\"parent.postMessage('go-home', '*'); return false;\">← 게임장으로<\/a>\n  <h1 id=\"title\">토끼 잡기<\/h1>\n\n  <section class=\"hud\">\n    <div class=\"stat\">\n      <span class=\"label\">점수<\/span>\n      <span class=\"value\" id=\"score\">0<\/span>\n    <\/div>\n    <div class=\"stat\">\n      <span class=\"label\">남은 시간<\/span>\n      <span class=\"value\" id=\"time\">30<\/span>\n    <\/div>\n    <div class=\"stat\">\n      <span class=\"label\" id=\"escapedLabel\">사라진 🐰<\/span>\n      <span class=\"value\" id=\"escaped\">0<\/span>\n    <\/div>\n    <button class=\"start\" id=\"startBtn\">게임 시작<\/button>\n  <\/section>\n\n  <section class=\"field\" id=\"field\" aria-label=\"토끼 굴 9개\">\n    <span class=\"finish\" aria-hidden=\"true\"><\/span>\n    <div class=\"switch-banner\" id=\"switchBanner\" aria-live=\"polite\"><\/div>\n    <div class=\"track\" aria-hidden=\"true\"><span class=\"turtle\" id=\"turtle\">🐢<\/span><\/div>\n  <\/section>\n\n  <p class=\"note\" id=\"note\">게임 시작을 누르면 30초 동안 진행돼요<\/p>\n<\/main>\n\n<div class=\"overlay\" id=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"overTitle\">\n  <div class=\"result-card\">\n    <div class=\"hourglass\" aria-hidden=\"true\">⏳<\/div>\n    <h2 class=\"over\" id=\"overTitle\">게임 오버!<\/h2>\n    <p class=\"label\">최종 점수<\/p>\n    <div class=\"final\"><span id=\"finalScore\">0<\/span><small>점<\/small><\/div>\n    <p class=\"escape-line\" id=\"escapeLine\">사라진 토끼 <b id=\"finalEscaped\">0<\/b>마리<\/p>\n    <p class=\"turtle-line\" id=\"turtleLine\"><\/p>\n    <button class=\"start\" id=\"againBtn\">다시 하기<\/button>\n  <\/div>\n<\/div>\n\n<script>\n  const GAME_SECONDS = 30;\n  const field = document.getElementById(\"field\");\n  const timeEl = document.getElementById(\"time\");\n  const startBtn = document.getElementById(\"startBtn\");\n  const note = document.getElementById(\"note\");\n\n  // 시작할 때 → 끝날 때 값으로 점점 빨라져요\n  const SHOW_START = 1000, SHOW_END = 450;   // 토끼가 나와 있는 시간\n  const GAP_START = 350,  GAP_END = 150;     // 다음 토끼까지 쉬는 시간\n  const CAT_CHANCE = 0.22;                   // 가면 고양이가 나올 확률\n  const CAT_PENALTY = 3;\n\n  const TURTLE_SVG = `\n    <svg class=\"turtle-svg\" viewBox=\"0 0 100 150\" aria-hidden=\"true\">\n      <rect x=\"38\" y=\"96\" width=\"24\" height=\"30\" rx=\"10\" fill=\"#9FD38A\" stroke=\"#6E9F5B\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"50\" cy=\"138\" rx=\"47\" ry=\"32\" fill=\"#E8D9A8\" stroke=\"#B9A574\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"50\" cy=\"136\" rx=\"42\" ry=\"29\" fill=\"#6FAF5A\" stroke=\"#4E8A3E\" stroke-width=\"1.5\"/>\n      <path d=\"M50 110 l12 8 v14 l-12 8 l-12 -8 v-14 z\" fill=\"#86C26F\" stroke=\"#4E8A3E\" stroke-width=\"1.5\"/>\n      <path d=\"M38 118 L20 120 M62 118 L80 120 M38 132 L18 140 M62 132 L82 140 M50 140 V160\" stroke=\"#4E8A3E\" stroke-width=\"1.5\" fill=\"none\"/>\n      <ellipse cx=\"50\" cy=\"82\" rx=\"27\" ry=\"26\" fill=\"#9FD38A\" stroke=\"#6E9F5B\" stroke-width=\"1.5\"/>\n      <circle cx=\"40\" cy=\"78\" r=\"6\" fill=\"#fff\"/>\n      <circle cx=\"60\" cy=\"78\" r=\"6\" fill=\"#fff\"/>\n      <circle cx=\"41\" cy=\"79\" r=\"3.6\" fill=\"#2A2020\"/>\n      <circle cx=\"61\" cy=\"79\" r=\"3.6\" fill=\"#2A2020\"/>\n      <circle cx=\"42.2\" cy=\"77.6\" r=\"1.2\" fill=\"#fff\"/>\n      <circle cx=\"62.2\" cy=\"77.6\" r=\"1.2\" fill=\"#fff\"/>\n      <circle cx=\"31\" cy=\"90\" r=\"4.5\" fill=\"#F4A3B0\" opacity=\".5\"/>\n      <circle cx=\"69\" cy=\"90\" r=\"4.5\" fill=\"#F4A3B0\" opacity=\".5\"/>\n      <path d=\"M42 92 Q50 99 58 92\" stroke=\"#3F6B33\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/>\n    <\/svg>`;\n\n  const CAT_SVG = `\n    <svg class=\"cat-svg\" viewBox=\"0 0 100 150\" aria-hidden=\"true\">\n      <polygon points=\"14,82 20,48 40,68\" fill=\"#F2A65A\" stroke=\"#C97A2E\" stroke-width=\"1.5\"/>\n      <polygon points=\"86,82 80,48 60,68\" fill=\"#F2A65A\" stroke=\"#C97A2E\" stroke-width=\"1.5\"/>\n      <polygon points=\"20,76 23,57 34,68\" fill=\"#F7C6B5\"/>\n      <polygon points=\"80,76 77,57 66,68\" fill=\"#F7C6B5\"/>\n      <ellipse cx=\"50\" cy=\"140\" rx=\"44\" ry=\"30\" fill=\"#F2A65A\" stroke=\"#C97A2E\" stroke-width=\"1.5\"/>\n      <path d=\"M30 128 q4 8 0 16 M70 128 q-4 8 0 16\" stroke=\"#D9822B\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/>\n      <ellipse cx=\"50\" cy=\"96\" rx=\"38\" ry=\"34\" fill=\"#F2A65A\" stroke=\"#C97A2E\" stroke-width=\"1.5\"/>\n      <path d=\"M44 66 v8 M50 64 v9 M56 66 v8\" stroke=\"#D9822B\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n      <ellipse cx=\"50\" cy=\"112\" rx=\"15\" ry=\"11\" fill=\"#FBE3CF\"/>\n      <ellipse cx=\"38\" cy=\"34\" rx=\"9\" ry=\"28\" fill=\"#FBF8F4\" stroke=\"#CDBFB2\" stroke-width=\"1.5\" transform=\"rotate(-6 38 34)\"/>\n      <ellipse cx=\"62\" cy=\"34\" rx=\"9\" ry=\"28\" fill=\"#FBF8F4\" stroke=\"#CDBFB2\" stroke-width=\"1.5\" transform=\"rotate(6 62 34)\"/>\n      <ellipse cx=\"38\" cy=\"36\" rx=\"4\" ry=\"19\" fill=\"#F4BCC6\" transform=\"rotate(-6 38 36)\"/>\n      <ellipse cx=\"62\" cy=\"36\" rx=\"4\" ry=\"19\" fill=\"#F4BCC6\" transform=\"rotate(6 62 36)\"/>\n      <path d=\"M17 82 L13 88 M83 82 L87 88\" stroke=\"#7A5C55\" stroke-width=\"1.5\"/>\n      <path d=\"M18 80 Q50 70 82 80 Q84 98 66 101 Q50 96 34 101 Q16 98 18 80 Z\" fill=\"#FBF8F4\" stroke=\"#CDBFB2\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"35\" cy=\"88\" rx=\"7\" ry=\"6\" fill=\"#2A2020\"/>\n      <ellipse cx=\"65\" cy=\"88\" rx=\"7\" ry=\"6\" fill=\"#2A2020\"/>\n      <ellipse cx=\"35\" cy=\"88\" rx=\"5\" ry=\"4.5\" fill=\"#8FD16A\"/>\n      <ellipse cx=\"65\" cy=\"88\" rx=\"5\" ry=\"4.5\" fill=\"#8FD16A\"/>\n      <rect x=\"34\" y=\"84\" width=\"2\" height=\"8\" rx=\"1\" fill=\"#1B1412\"/>\n      <rect x=\"64\" y=\"84\" width=\"2\" height=\"8\" rx=\"1\" fill=\"#1B1412\"/>\n      <polygon points=\"46,106 54,106 50,110\" fill=\"#E8899A\"/>\n      <path d=\"M50 110 q-4 5 -8 1 M50 110 q4 5 8 1\" stroke=\"#7A5C55\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\"/>\n      <path d=\"M30 110 h-16 M30 114 l-15 4 M70 110 h16 M70 114 l15 4\" stroke=\"#7A5C55\" stroke-width=\"1.2\" stroke-linecap=\"round\"/>\n    <\/svg>`;\n\n  const MOLE_SVG = `\n    <svg class=\"rabbit-svg\" viewBox=\"0 0 100 150\" aria-hidden=\"true\">\n      <g stroke=\"#CDBFB2\" stroke-width=\"1.5\">\n        <ellipse cx=\"33\" cy=\"38\" rx=\"11\" ry=\"34\" fill=\"#FBF8F4\" transform=\"rotate(-10 33 38)\"/>\n        <ellipse cx=\"67\" cy=\"38\" rx=\"11\" ry=\"34\" fill=\"#FBF8F4\" transform=\"rotate(10 67 38)\"/>\n        <ellipse cx=\"50\" cy=\"140\" rx=\"44\" ry=\"30\" fill=\"#FBF8F4\"/>\n        <ellipse cx=\"50\" cy=\"96\" rx=\"38\" ry=\"34\" fill=\"#FBF8F4\"/>\n      <\/g>\n      <ellipse cx=\"33\" cy=\"40\" rx=\"5\" ry=\"25\" fill=\"#F4BCC6\" transform=\"rotate(-10 33 40)\"/>\n      <ellipse cx=\"67\" cy=\"40\" rx=\"5\" ry=\"25\" fill=\"#F4BCC6\" transform=\"rotate(10 67 40)\"/>\n      <circle cx=\"36\" cy=\"92\" r=\"5\" fill=\"#2A2020\"/>\n      <circle cx=\"64\" cy=\"92\" r=\"5\" fill=\"#2A2020\"/>\n      <circle cx=\"37.6\" cy=\"90.4\" r=\"1.7\" fill=\"#fff\"/>\n      <circle cx=\"65.6\" cy=\"90.4\" r=\"1.7\" fill=\"#fff\"/>\n      <circle cx=\"25\" cy=\"104\" r=\"6\" fill=\"#F4A3B0\" opacity=\".45\"/>\n      <circle cx=\"75\" cy=\"104\" r=\"6\" fill=\"#F4A3B0\" opacity=\".45\"/>\n      <ellipse cx=\"50\" cy=\"102\" rx=\"4.5\" ry=\"3.2\" fill=\"#E8899A\"/>\n      <path d=\"M50 105 Q46 111 41 108 M50 105 Q54 111 59 108\" stroke=\"#7A5C55\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/>\n      <rect x=\"46.5\" y=\"107.5\" width=\"7\" height=\"7\" rx=\"1.5\" fill=\"#fff\" stroke=\"#CDBFB2\" stroke-width=\"1\"/>\n    <\/svg>`;\n\n  const holes = [];\n  for (let i = 0; i < 9; i++) {\n    const h = document.createElement(\"button\");\n    h.className = \"hole\";\n    h.dataset.index = i;\n    h.setAttribute(\"aria-label\", `구멍 ${i + 1}`);\n    h.innerHTML = `<div class=\"mole-wrap\"><div class=\"mole\">${MOLE_SVG}${TURTLE_SVG}${CAT_SVG}<\/div><\/div>`;\n    field.appendChild(h);\n    holes.push(h);\n  }\n\n  const POINTS = 2;       // 토끼 한 마리당 점수\n  const scoreEl = document.getElementById(\"score\");\n\n  let timer = null, moleTimer = null, playing = false, lastIndex = -1;\n  let score = 0, activeHole = null, escaped = 0, timeLeft = GAME_SECONDS, popCount = 0;\n  const escapedEl = document.getElementById(\"escaped\");\n\n  // 거북이가 이 횟수만큼 이기면 거북이 잡기로 바뀜\n  const SWITCH_AT = 3;\n  let mode = \"rabbit\", escapedRabbits = 0, escapedTurtles = 0, pauseUntil = 0;\n  const titleEl = document.getElementById(\"title\");\n  const escapedLabel = document.getElementById(\"escapedLabel\");\n  const banner = document.getElementById(\"switchBanner\");\n\n  // 0(시작) → 1(끝) 진행도에 맞춰 시간 계산\n  function progress() { return (GAME_SECONDS - timeLeft) / GAME_SECONDS; }\n  function showMs() { return SHOW_START - (SHOW_START - SHOW_END) * progress(); }\n  function gapMs()  { return GAP_START - (GAP_START - GAP_END) * progress(); }\n\n  function bump(el) {\n    el.classList.remove(\"bump\");\n    void el.offsetWidth;\n    el.classList.add(\"bump\");\n  }\n\n  function popMole() {\n    if (!playing) return;\n    let idx;\n    do { idx = Math.floor(Math.random() * 9); } while (idx === lastIndex);\n    lastIndex = idx;\n    const hole = holes[idx];\n    popCount++;\n    const isCat = popCount > 2 && Math.random() < CAT_CHANCE;\n    hole.classList.toggle(\"cat\", isCat);\n    activeHole = hole;\n    hole.classList.add(\"up\");\n    moleTimer = setTimeout(() => {\n      hole.classList.remove(\"up\");\n      activeHole = null;\n      if (!isCat) animalEscaped();\n      const wait = Math.max(gapMs(), pauseUntil - Date.now());\n      moleTimer = setTimeout(popMole, wait);\n    }, showMs());\n  }\n\n  function animalEscaped() {\n    if (mode === \"rabbit\") escapedRabbits++; else escapedTurtles++;\n    escaped = mode === \"rabbit\" ? escapedRabbits : escapedTurtles;\n    escapedEl.textContent = escaped;\n    bump(escapedEl);\n    turtleCheer();\n    if (mode === \"rabbit\" && escapedRabbits >= SWITCH_AT) switchToTurtle();\n  }\n\n  function switchToTurtle() {\n    mode = \"turtle\";\n    field.classList.add(\"turtle-mode\");\n    titleEl.textContent = \"거북이 잡기\";\n    titleEl.classList.remove(\"swap\"); void titleEl.offsetWidth; titleEl.classList.add(\"swap\");\n    escapedLabel.textContent = \"사라진 🐢\";\n    escapedEl.textContent = 0;\n    setTimeout(() => { if (mode === \"turtle\") turtle.textContent = \"🐇\"; }, 1000);\n    note.textContent = \"이번엔 토끼가 달려요! 거북이를 잡아요\";\n    banner.innerHTML = \"🐢 거북이가 3번 이겼어요!<br>이제 거북이 잡기!\";\n    banner.classList.remove(\"show\"); void banner.offsetWidth; banner.classList.add(\"show\");\n    pauseUntil = Date.now() + 1500;\n  }\n\n  function resetMode() {\n    mode = \"rabbit\";\n    escapedRabbits = 0; escapedTurtles = 0; pauseUntil = 0;\n    field.classList.remove(\"turtle-mode\");\n    titleEl.textContent = \"토끼 잡기\";\n    escapedLabel.textContent = \"사라진 🐰\";\n    turtle.textContent = \"🐢\";\n    banner.classList.remove(\"show\");\n  }\n\n  function turtleCheer() {\n    const b = document.createElement(\"span\");\n    b.className = \"bubble\";\n    b.textContent = \"아싸 이김!\";\n    b.style.left = turtle.style.left || \"0%\";\n    turtle.parentNode.appendChild(b);\n    setTimeout(() => b.remove(), 1000);\n    turtle.classList.remove(\"cheer\");\n    void turtle.offsetWidth;\n    turtle.classList.add(\"cheer\");\n  }\n\n  function showBurst(hole, isCat) {\n    const b = document.createElement(\"div\");\n    b.className = \"burst\";\n    const icon = isCat ? \"💢\" : \"💫\";\n    const text = isCat ? `−${CAT_PENALTY}` : `+${POINTS}`;\n    let html = `<span class=\"dizzy main\">${icon}<\/span><span class=\"plus${isCat ? \" minus\" : \"\"}\">${text}<\/span>`;\n    for (let i = 0; i < 5; i++) {\n      const a = (Math.PI * 2 * i) / 5 - Math.PI / 2;\n      html += `<span class=\"dizzy\" style=\"--dx:${Math.cos(a) * 44}px;--dy:${Math.sin(a) * 44}px\">${icon}<\/span>`;\n    }\n    b.innerHTML = html;\n    hole.appendChild(b);\n    setTimeout(() => b.remove(), 750);\n  }\n\n  function whack(hole) {\n    // 빈 구멍이거나 이미 잡힌 토끼면 아무 일도 없음\n    if (!playing || hole !== activeHole) return;\n    activeHole = null;\n    clearTimeout(moleTimer);\n\n    const isCat = hole.classList.contains(\"cat\");\n    score += isCat ? -CAT_PENALTY : POINTS;\n    scoreEl.textContent = score;\n    bump(scoreEl);\n\n    hole.classList.add(\"hit\");\n    hole.classList.remove(\"up\");\n    showBurst(hole, isCat);\n    if (isCat) note.textContent = \"앗! 토끼 가면을 쓴 고양이였어요 😼\";\n    else note.textContent = mode === \"turtle\" ? \"거북이를 잡아요!\" : \"토끼를 잡아요! 가면 쓴 고양이는 −3점\";\n\n    moleTimer = setTimeout(() => {\n      hole.classList.remove(\"hit\");\n      moleTimer = setTimeout(popMole, gapMs());\n    }, 380);\n  }\n\n  holes.forEach(h => h.addEventListener(\"pointerdown\", e => {\n    e.preventDefault();\n    whack(h);\n  }));\n  holes.forEach(h => h.addEventListener(\"keydown\", e => {\n    if (e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); whack(h); }\n  }));\n\n  const turtle = document.getElementById(\"turtle\");\n  function moveTurtle(left, animate) {\n    turtle.style.transition = animate ? \"\" : \"none\";\n    turtle.style.left = ((GAME_SECONDS - left) / GAME_SECONDS) * 100 + \"%\";\n  }\n\n  function stopGame() {\n    playing = false;\n    activeHole = null;\n    clearInterval(timer);\n    clearTimeout(moleTimer);\n    holes.forEach(h => h.classList.remove(\"up\", \"hit\"));\n    field.classList.add(\"locked\");\n    timeEl.textContent = 0;\n    startBtn.disabled = false;\n    startBtn.textContent = \"다시 하기\";\n    note.textContent = \"시간 종료!\";\n\n    document.getElementById(\"finalScore\").textContent = score;\n    const line = document.getElementById(\"escapeLine\");\n    const cheer = document.getElementById(\"turtleLine\");\n    if (mode === \"turtle\") {\n      line.innerHTML = `사라진 토끼 <b>${escapedRabbits}<\/b>마리, 거북이 <b>${escapedTurtles}<\/b>마리`;\n      cheer.innerHTML = `🐢 거북이: 아싸 이김! × ${escapedRabbits}<br>🐇 토끼: ` +\n        (escapedTurtles > 0 ? `아싸 이김! × ${escapedTurtles}` : \"하나도 못 이겼다…\");\n    } else {\n      line.innerHTML = `사라진 토끼 <b>${escapedRabbits}<\/b>마리`;\n      cheer.textContent = escapedRabbits > 0\n        ? `🐢 거북이: 아싸 이김! × ${escapedRabbits}` : \"🐢 거북이: 하나도 못 이겼다…\";\n    }\n    document.getElementById(\"overlay\").classList.add(\"show\");\n    document.getElementById(\"againBtn\").focus();\n  }\n\n  function startGame() {\n    document.getElementById(\"overlay\").classList.remove(\"show\");\n    field.classList.remove(\"locked\");\n    timeLeft = GAME_SECONDS;\n    timeEl.textContent = timeLeft;\n    moveTurtle(timeLeft, false);\n    startBtn.disabled = true;\n    startBtn.textContent = \"진행 중\";\n    note.textContent = \"토끼를 잡아요! 가면 쓴 고양이는 −3점\";\n    clearInterval(timer);\n    clearTimeout(moleTimer);\n    playing = true;\n    lastIndex = -1;\n    score = 0;\n    scoreEl.textContent = 0;\n    escaped = 0;\n    escapedEl.textContent = 0;\n    resetMode();\n    popCount = 0;\n    holes.forEach(h => h.classList.remove(\"cat\"));\n    holes.forEach(h => h.classList.remove(\"up\", \"hit\"));\n    popMole();\n    timer = setInterval(() => {\n      timeLeft--;\n      timeEl.textContent = timeLeft;\n      moveTurtle(timeLeft, true);\n      if (timeLeft === 20 && mode === \"rabbit\") note.textContent = \"점점 빨라져요!\";\n      if (timeLeft === 10) note.textContent = \"마지막 10초, 최고 속도!\";\n      if (timeLeft <= 0) stopGame();\n    }, 1000);\n  }\n\n  startBtn.addEventListener(\"click\", startGame);\n  document.getElementById(\"againBtn\").addEventListener(\"click\", startGame);\n<\/script>\n<\/body>\n<\/html>\n"}, {"file": "brick.html", "emoji": "🧱", "color": "#4DE1E8", "title": "컴퓨터와 대결하기", "desc": "1분 벽돌깨기 대결! 이기면 다음 단계, 3단계까지 💣", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>컴퓨터와 대결하기<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --room: #2A1B4A;\n    --cabinet: #4B2C7A;\n    --cabinet-d: #2F1B52;\n    --bezel: #120D26;\n    --screen: #0F1633;\n    --text: #F3EEFF;\n    --yellow: #FFD23F;\n    --pink: #FF5D8F;\n    --cyan: #4DE1E8;\n    --violet: #B49BFF;\n    box-sizing: border-box;\n    padding-top: env(safe-area-inset-top, 0px);\n    padding-bottom: env(safe-area-inset-bottom, 0px);\n  }\n  *, *::before, *::after { box-sizing: inherit; }\n  html { scroll-padding-top: env(safe-area-inset-top, 0px); }\n  body {\n    margin: 0;\n    min-height: 100vh;\n    font-family: \"Do Hyeon\", \"Apple SD Gothic Neo\", \"Malgun Gothic\", sans-serif;\n    color: var(--text);\n    background:\n      radial-gradient(circle at 50% 0%, #3E2870 0%, transparent 60%),\n      repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 10px, transparent 10px 20px),\n      var(--room);\n    display: flex;\n    justify-content: center;\n    padding: 20px 12px 36px;\n  }\n  .wrap { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 14px; }\n\n  .home {\n    align-self: flex-start;\n    font-family: inherit;\n    font-size: 1rem;\n    color: var(--text);\n    text-decoration: none;\n    border: 2px solid rgba(255,255,255,.35);\n    border-radius: 8px;\n    padding: 5px 12px;\n  }\n  .home:hover { background: rgba(255,255,255,.08); }\n  .home:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\n\n  /* 오락기 본체 */\n  .cabinet {\n    background: linear-gradient(180deg, var(--cabinet) 0%, var(--cabinet-d) 100%);\n    border-radius: 18px;\n    padding: 12px 12px 16px;\n    box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 14px 0 #1C1136, 0 24px 40px -10px rgba(0,0,0,.6);\n  }\n  .marquee {\n    text-align: center;\n    padding: 12px 6px 12px;\n    margin-bottom: 12px;\n    border-radius: 10px;\n    background: var(--bezel);\n    border: 3px solid #000;\n  }\n  .marquee h1 {\n    margin: 0;\n    font-weight: 400;\n    font-size: clamp(1.9rem, 8vw, 2.6rem);\n    line-height: 1.1;\n    color: var(--yellow);\n    text-shadow: 3px 3px 0 var(--pink);\n  }\n  .marquee .sub {\n    margin-top: 8px;\n    font-family: \"Press Start 2P\", monospace;\n    font-size: clamp(.55rem, 2.6vw, .75rem);\n    color: var(--cyan);\n    letter-spacing: .12em;\n  }\n\n  /* 타이머 + 시작 버튼 */\n  .control {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 10px;\n    background: var(--bezel);\n    border: 3px solid #000;\n    border-radius: 10px;\n    padding: 8px 8px 8px 14px;\n    margin-bottom: 12px;\n  }\n  .timer { font-family: \"Press Start 2P\", monospace; font-size: clamp(.8rem, 3.6vw, 1rem); }\n  .timer .label { color: var(--cyan); margin-right: 10px; }\n  .timer .stage-now { color: var(--pink); margin-right: 14px; }\n  .timer .value { color: var(--yellow); }\n  .timer.low .value { color: var(--pink); animation: blink .5s steps(2) infinite; }\n  .start {\n    font-family: inherit;\n    font-size: 1.2rem;\n    color: #1A1238;\n    background: var(--yellow);\n    border: 3px solid #000;\n    padding: 6px 16px;\n    cursor: pointer;\n    box-shadow: 4px 4px 0 #000;\n    white-space: nowrap;\n  }\n  .start:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }\n  .start:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }\n  .start:disabled { background: #6E6A9A; cursor: default; }\n\n  /* 두 개의 게임 화면 */\n  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\n  .bezel {\n    background: var(--bezel);\n    border-radius: 12px;\n    padding: 8px;\n    border: 3px solid #000;\n  }\n  .side-head {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding: 0 2px 4px;\n    gap: 4px;\n  }\n  .side-head .name { font-size: clamp(1rem, 4.2vw, 1.25rem); }\n  .me .name { color: var(--yellow); }\n  .cpu .name { color: var(--violet); }\n  .hearts { font-size: clamp(.6rem, 2.8vw, .9rem); letter-spacing: 1px; line-height: 1; white-space: nowrap; }\n  .side-score {\n    font-family: \"Press Start 2P\", monospace;\n    font-size: clamp(.5rem, 2.4vw, .72rem);\n    padding: 0 2px 8px;\n  }\n  .side-score { display: flex; justify-content: space-between; gap: 4px; }\n  .side-score .label { color: var(--cyan); margin-right: 6px; }\n  .side-score .stage { color: var(--pink); }\n\n  .screen {\n    position: relative;\n    border-radius: 6px;\n    overflow: hidden;\n    background: var(--screen);\n  }\n  canvas {\n    display: block;\n    width: 100%;\n    height: auto;\n    image-rendering: pixelated;\n    image-rendering: crisp-edges;\n  }\n  #meCanvas { touch-action: none; cursor: pointer; }\n  .screen::after {\n    content: \"\";\n    position: absolute; inset: 0;\n    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);\n    box-shadow: inset 0 0 30px rgba(0,0,0,.6);\n    pointer-events: none;\n  }\n\n  /* 결과 영역 */\n  .result {\n    margin-top: 12px;\n    min-height: 150px;\n    border: 3px dashed rgba(77, 225, 232, .55);\n    border-radius: 10px;\n    background: rgba(18, 13, 38, .6);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    gap: 6px;\n    padding: 16px;\n    text-align: center;\n    word-break: keep-all;\n  }\n  .result .hint { opacity: .55; font-size: 1.1rem; }\n  .result .emoji { font-size: 3.4rem; line-height: 1; }\n  .result .verdict { font-size: 2rem; }\n  .verdict.win { color: var(--yellow); text-shadow: 2px 2px 0 var(--pink); }\n  .verdict.lose { color: var(--violet); }\n  .verdict.draw { color: var(--cyan); }\n  .result .scores { font-family: \"Press Start 2P\", monospace; font-size: .7rem; line-height: 1.8; opacity: .9; }\n  .result .congrats { font-size: 1.5rem; color: var(--pink); margin-top: 4px; }\n  .result .start { margin-top: 8px; }\n  .result .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }\n  .result .start.sub { background: var(--cyan); }\n  .pop { animation: popin .4s steps(4); }\n  @keyframes popin { from { transform: scale(.3); opacity: 0; } }\n  @keyframes blink { 50% { opacity: 0; } }\n\n  .help { margin: 10px 0 0; text-align: center; font-size: .95rem; opacity: .7; }\n\n  .panel { display: flex; justify-content: center; gap: 22px; margin-top: 14px; }\n  .knob {\n    width: 40px; height: 40px; border-radius: 50%;\n    border: 3px solid #000;\n    box-shadow: inset 0 -5px 0 rgba(0,0,0,.3), 0 4px 0 #1C1136;\n  }\n  .knob.red { background: var(--pink); }\n  .knob.yellow { background: var(--yellow); }\n  .knob.cyan { background: var(--cyan); }\n\n  @media (prefers-reduced-motion: reduce) {\n    .pop, .timer.low .value { animation: none; }\n  }\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n  <a class=\"home\" href=\"#\" onclick=\"parent.postMessage('go-home', '*'); return false;\">◀ 게임장으로<\/a>\n\n  <section class=\"cabinet\">\n    <header class=\"marquee\">\n      <h1>컴퓨터와 대결하기<\/h1>\n      <div class=\"sub\">BRICK BREAKER · VS CPU<\/div>\n    <\/header>\n\n    <div class=\"control\">\n      <div class=\"timer\" id=\"timerBox\"><span class=\"stage-now\" id=\"stageNow\">STAGE 1<\/span><span class=\"label\">TIME<\/span><span class=\"value\" id=\"time\">60<\/span><\/div>\n      <button class=\"start\" id=\"startBtn\">게임 시작<\/button>\n    <\/div>\n\n    <div class=\"boards\">\n      <div class=\"bezel me\">\n        <div class=\"side-head\"><span class=\"name\">🙋 나<\/span><span class=\"hearts\" id=\"meLives\">❤️❤️❤️<\/span><\/div>\n        <div class=\"side-score\"><span><span class=\"label\">SCORE<\/span><span id=\"meScore\">000000<\/span><\/span><span class=\"stage\" id=\"meStage\">ST.1<\/span><\/div>\n        <div class=\"screen\"><canvas id=\"meCanvas\" width=\"236\" height=\"320\" aria-label=\"내 벽돌깨기 화면\"><\/canvas><\/div>\n      <\/div>\n      <div class=\"bezel cpu\">\n        <div class=\"side-head\"><span class=\"name\">🤖 컴퓨터<\/span><span class=\"hearts\" id=\"cpuLives\">❤️❤️❤️<\/span><\/div>\n        <div class=\"side-score\"><span><span class=\"label\">SCORE<\/span><span id=\"cpuScore\">000000<\/span><\/span><span class=\"stage\" id=\"cpuStage\">ST.1<\/span><\/div>\n        <div class=\"screen\"><canvas id=\"cpuCanvas\" width=\"236\" height=\"320\" aria-label=\"컴퓨터 벽돌깨기 화면\"><\/canvas><\/div>\n      <\/div>\n    <\/div>\n\n    <section class=\"result\" id=\"result\" aria-live=\"polite\">\n      <div class=\"hint\">결과가 여기에 표시돼요<\/div>\n    <\/section>\n\n    <p class=\"help\">← → 로 구름 이동 · 스페이스로 발사 (휴대폰은 내 화면을 끌고 탭)<br>컴퓨터를 이기면 다음 단계! 단계마다 공이 빨라지고, 2단계부터 💣 폭탄이 주변 벽돌을 함께 깨요<\/p>\n\n    <div class=\"panel\" aria-hidden=\"true\">\n      <span class=\"knob red\"><\/span><span class=\"knob yellow\"><\/span><span class=\"knob cyan\"><\/span>\n    <\/div>\n  <\/section>\n<\/main>\n\n<script>\n  // ================= 설정 =================\n  const GAME_SECONDS = 60;\n  const W = 236, H = 320, WALL = 4;\n  const ROWS = 3, COLS = 6;\n  const BRICK_W = 32, BRICK_H = 12, GAP = 4, SIDE = 12, TOP = 36;\n  const COLORS = [\"#FF5D8F\", \"#FF9F43\", \"#FFD23F\", \"#7BE06A\", \"#4DE1E8\", \"#9B7BFF\"];\n  const BRICK_POINTS = 10;\n  const LIVES = 3;\n  const PADDLE_SPEED = 270;   // 내 구름 속도\n  const CPU_SPEED = 190;      // 컴퓨터 구름 속도 (조금 느림)\n  const BASE_SPEED = 190;                    // 원래 공 속도\n  const STAGE_SPEED = [0.75, 0.80, 0.85];      // 1·2·3단계 공 속도 비율\n  const STAGE_BOMBS = [0, 1, 2];               // 1·2·3단계 💣 개수\n  const MAX_STAGE = 3;\n  const PADDLE_W = 46, PADDLE_H = 15;\n\n  // ================= 그리기 도구 =================\n  function shade(hex, amt) {\n    const n = parseInt(hex.slice(1), 16);\n    const f = v => Math.max(0, Math.min(255, v + amt));\n    return `rgb(${f(n >> 16)}, ${f((n >> 8) & 255)}, ${f(n & 255)})`;\n  }\n\n  function makeCloud(p) {\n    const w = PADDLE_W, h = PADDLE_H;\n    const c = document.createElement(\"canvas\");\n    c.width = w; c.height = h + 2;\n    const g = c.getContext(\"2d\");\n    const puffs = [[7, 10, 5], [16, 7, 6.5], [29, 6.5, 7], [39, 10, 5.5]];\n    const inside = (px, py) =>\n      (px >= 6 && px <= w - 7 && py >= 9 && py <= h - 1) ||\n      puffs.some(([cx, cy, r]) => (px + .5 - cx) ** 2 + (py + .5 - cy) ** 2 <= r * r);\n    for (let py = 0; py < h; py++) {\n      for (let px = 0; px < w; px++) {\n        if (!inside(px, py)) continue;\n        const edge = !inside(px - 1, py) || !inside(px + 1, py) || !inside(px, py - 1);\n        if (!inside(px, py + 1)) g.fillStyle = p.bottom;\n        else if (edge) g.fillStyle = p.edge;\n        else if (py >= h - 4) g.fillStyle = p.low;\n        else if (!inside(px, py - 2)) g.fillStyle = \"#FFFFFF\";\n        else g.fillStyle = p.body;\n        g.fillRect(px, py, 1, 1);\n      }\n    }\n    g.fillStyle = \"rgba(143, 174, 223, .25)\";\n    g.fillRect(9, h + 1, w - 18, 1);\n    return c;\n  }\n  const CLOUD_ME  = makeCloud({ bottom: \"#7F9FD6\", edge: \"#A9C3EE\", low: \"#D3E2F8\", body: \"#F1F6FF\" });\n  const CLOUD_CPU = makeCloud({ bottom: \"#8E78D6\", edge: \"#B9A8F0\", low: \"#DDD3FA\", body: \"#F4F0FF\" });\n\n  function bob(seed) { return Math.round(Math.sin(performance.now() / 380 + seed)); }\n\n  const pad6 = n => String(n).padStart(6, \"0\");\n  const heartsText = n => \"❤️\".repeat(n) + \"🤍\".repeat(LIVES - n);\n\n  // ================= 보드 (게임 화면 하나) =================\n  class Board {\n    constructor(canvas, opts) {\n      this.ctx = canvas.getContext(\"2d\");\n      this.isCpu = opts.isCpu;\n      this.cloud = opts.cloud;\n      this.scoreEl = opts.scoreEl;\n      this.livesEl = opts.livesEl;\n      this.stageEl = opts.stageEl;\n      this.seed = opts.isCpu ? 1.7 : 0;\n      this.reset();\n    }\n\n    reset(stage = 1) {\n      this.bricks = [];\n      this.stage = stage;\n      this.fillBricks();\n      this.paddle = { w: PADDLE_W, h: PADDLE_H, x: (W - PADDLE_W) / 2, y: H - 34 };\n      this.ball = { size: 6, x: 0, y: 0, vx: 0, vy: 0 };\n      this.score = 0;\n      this.lives = LIVES;\n      this.state = \"hold\";        // hold → fly → gone / refill / out\n      this.wait = 0;\n      this.cpuAim = 0;\n      this.particles = [];\n      this.popups = [];\n      this.blasts = [];\n      this.targetX = null;        // 터치로 정한 목표 위치\n      this.placeBall();\n      this.updateHud();\n    }\n\n    fillBricks() {\n      this.bricks.length = 0;\n      for (let r = 0; r < ROWS; r++)\n        for (let c = 0; c < COLS; c++)\n          this.bricks.push({\n            x: SIDE + c * (BRICK_W + GAP),\n            y: TOP + r * (BRICK_H + GAP),\n            color: COLORS[(c + r * 2) % COLORS.length],\n            alive: true,\n            bomb: false\n          });\n      // 💣 폭탄: 가운데 줄에 단계별 개수만큼 (서로 다른 칸)\n      const cols = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - .5);\n      for (let i = 0; i < STAGE_BOMBS[this.stage - 1]; i++) {\n        this.bricks[1 * COLS + cols[i]].bomb = true;\n      }\n    }\n\n    speed() { return BASE_SPEED * STAGE_SPEED[this.stage - 1]; }\n\n    updateHud() {\n      this.scoreEl.textContent = pad6(this.score);\n      this.livesEl.textContent = heartsText(this.lives);\n      this.stageEl.textContent = \"ST.\" + this.stage;\n    }\n\n    placeBall() {\n      this.ball.x = this.paddle.x + this.paddle.w / 2 - this.ball.size / 2;\n      this.ball.y = this.paddle.y - this.ball.size + 2;\n    }\n\n    launch() {\n      if (this.state !== \"hold\") return;\n      this.state = \"fly\";\n      const angle = (Math.random() * 30 + 30) * Math.PI / 180 * (Math.random() < .5 ? -1 : 1);\n      this.ball.vx = this.speed() * Math.sin(angle);\n      this.ball.vy = -this.speed() * Math.cos(angle);\n      this.newCpuAim();\n    }\n\n    newCpuAim() {\n      // 컴퓨터는 공을 받을 위치를 매번 조금씩 틀리게 잡음 → 가끔 놓침\n      this.cpuAim = (Math.random() - .5) * 60;\n    }\n\n    movePaddle(dt, input) {\n      const p = this.paddle;\n      let dir = 0, speed = PADDLE_SPEED;\n      if (this.isCpu) {\n        speed = CPU_SPEED;\n        const goal = this.state === \"fly\" && this.ball.vy > 0\n          ? this.ball.x + this.ball.size / 2 + this.cpuAim\n          : W / 2;\n        const diff = goal - (p.x + p.w / 2);\n        if (Math.abs(diff) > 3) dir = Math.sign(diff);\n        p.x += dir * Math.min(speed * dt, Math.abs(diff));\n      } else {\n        if (this.targetX !== null && !input.left && !input.right) {\n          const diff = this.targetX - (p.x + p.w / 2);\n          p.x += Math.sign(diff) * Math.min(speed * dt, Math.abs(diff));\n        } else {\n          dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);\n          p.x += dir * speed * dt;\n        }\n      }\n      p.x = Math.max(WALL, Math.min(W - WALL - p.w, p.x));\n    }\n\n    update(dt, running, input) {\n      if (this.state !== \"out\" && running) this.movePaddle(dt, input);\n\n      if (this.state === \"hold\") {\n        this.placeBall();\n        if (running && this.isCpu) {\n          this.wait += dt;\n          if (this.wait > .6) { this.wait = 0; this.launch(); }\n        }\n      } else if (this.state === \"fly\" && running) {\n        this.moveBall(dt);\n      } else if (this.state === \"gone\" || this.state === \"refill\") {\n        this.wait -= dt;\n        if (this.wait <= 0) {\n          if (this.state === \"refill\") {\n            this.fillBricks();\n            this.updateHud();\n          }\n          this.state = \"hold\";\n          this.wait = 0;\n        }\n      }\n      this.updateEffects(dt);\n    }\n\n    moveBall(dt) {\n      const b = this.ball, s = b.size;\n      b.x += b.vx * dt;\n      b.y += b.vy * dt;\n\n      if (b.x < WALL) { b.x = WALL + (WALL - b.x); b.vx = Math.abs(b.vx); }\n      else if (b.x + s > W - WALL) { b.x = (W - WALL - s) - (b.x + s - (W - WALL)); b.vx = -Math.abs(b.vx); }\n      if (b.y < WALL) { b.y = WALL + (WALL - b.y); b.vy = Math.abs(b.vy); if (this.isCpu) this.newCpuAim(); }\n\n      this.hitBricks();\n      if (this.state !== \"fly\") return;\n\n      // 구름으로 받아치기: 맞은 위치에 따라 튀어나가는 각도가 달라짐\n      const p = this.paddle;\n      if (b.vy > 0 && b.y + s >= p.y + 1 && b.y + s <= p.y + 9 && b.x + s > p.x + 2 && b.x < p.x + p.w - 2) {\n        const rel = Math.max(-1, Math.min(1, ((b.x + s / 2) - (p.x + p.w / 2)) / (p.w / 2)));\n        const angle = rel * 60 * Math.PI / 180;\n        b.vx = this.speed() * Math.sin(angle);\n        b.vy = -this.speed() * Math.cos(angle);\n        b.y = p.y + 1 - s;\n      }\n\n      if (b.y > H) {\n        this.lives--;\n        this.updateHud();\n        if (this.lives <= 0) this.state = \"out\";\n        else { this.state = \"gone\"; this.wait = .7; }\n      }\n    }\n\n    hitBricks() {\n      const b = this.ball, s = b.size;\n      for (const k of this.bricks) {\n        if (!k.alive) continue;\n        if (b.x + s <= k.x || b.x >= k.x + BRICK_W || b.y + s <= k.y || b.y >= k.y + BRICK_H) continue;\n        const ox = Math.min(b.x + s - k.x, k.x + BRICK_W - b.x);\n        const oy = Math.min(b.y + s - k.y, k.y + BRICK_H - b.y);\n        if (ox < oy) {\n          if (b.x + s / 2 < k.x + BRICK_W / 2) { b.x -= ox; b.vx = -Math.abs(b.vx); }\n          else { b.x += ox; b.vx = Math.abs(b.vx); }\n        } else {\n          if (b.y + s / 2 < k.y + BRICK_H / 2) { b.y -= oy; b.vy = -Math.abs(b.vy); }\n          else { b.y += oy; b.vy = Math.abs(b.vy); }\n        }\n        this.breakBrick(k);\n        return;\n      }\n    }\n\n    breakBrick(first) {\n      // 폭탄이면 주변 8칸을 함께 깨고, 옆에 폭탄이 있으면 연쇄 폭발\n      const queue = [first];\n      while (queue.length) {\n        const k = queue.shift();\n        if (!k.alive) continue;\n        k.alive = false;\n        this.score += BRICK_POINTS;\n        this.popups.push({ x: k.x + BRICK_W / 2, y: k.y, life: .8, text: \"+\" + BRICK_POINTS, color: \"#FFD23F\" });\n        for (let i = 0; i < 12; i++) {\n          this.particles.push({\n            x: k.x + Math.random() * BRICK_W, y: k.y + Math.random() * BRICK_H,\n            vx: (Math.random() - .5) * 90, vy: -Math.random() * 60,\n            life: .7, color: k.bomb ? \"#FF9F43\" : (i % 3 ? k.color : \"#FFFFFF\")\n          });\n        }\n        if (k.bomb) {\n          this.explode(k);\n          for (const n of this.bricks) {\n            if (!n.alive) continue;\n            if (Math.abs(n.x - k.x) <= BRICK_W + GAP && Math.abs(n.y - k.y) <= BRICK_H + GAP) queue.push(n);\n          }\n        }\n      }\n      this.updateHud();\n      // 다 깨면 잠시 뒤 다음 단계 벽돌이 채워져서 계속 대결\n      if (this.bricks.every(x => !x.alive)) { this.state = \"refill\"; this.wait = 1.1; }\n    }\n\n    explode(k) {\n      const cx = k.x + BRICK_W / 2, cy = k.y + BRICK_H / 2;\n      this.blasts.push({ x: cx, y: cy, life: .35 });\n      for (let i = 0; i < 26; i++) {\n        const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 110;\n        this.particles.push({\n          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,\n          life: .7, color: [\"#FFD23F\", \"#FF9F43\", \"#FF5D8F\", \"#FFFFFF\"][i % 4]\n        });\n      }\n      this.popups.push({ x: cx, y: cy - 6, life: .9, text: \"BOOM!\", color: \"#FF9F43\" });\n    }\n\n    updateEffects(dt) {\n      for (let i = this.particles.length - 1; i >= 0; i--) {\n        const p = this.particles[i];\n        p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;\n        if (p.life <= 0) this.particles.splice(i, 1);\n      }\n      for (let i = this.blasts.length - 1; i >= 0; i--) {\n        this.blasts[i].life -= dt;\n        if (this.blasts[i].life <= 0) this.blasts.splice(i, 1);\n      }\n      for (let i = this.popups.length - 1; i >= 0; i--) {\n        this.popups[i].y -= 22 * dt;\n        this.popups[i].life -= dt;\n        if (this.popups[i].life <= 0) this.popups.splice(i, 1);\n      }\n    }\n\n    drawBomb(k) {\n      const ctx = this.ctx;\n      const flash = Math.floor(performance.now() / 250) % 2 === 0;\n      ctx.fillStyle = \"#000\";\n      ctx.fillRect(k.x, k.y, BRICK_W, BRICK_H);\n      ctx.fillStyle = flash ? \"#3A2140\" : \"#2A1830\";\n      ctx.fillRect(k.x + 1, k.y + 1, BRICK_W - 2, BRICK_H - 2);\n      ctx.strokeStyle = flash ? \"#FF5D8F\" : \"#FF9F43\";\n      ctx.lineWidth = 1;\n      ctx.strokeRect(k.x + .5, k.y + .5, BRICK_W - 1, BRICK_H - 1);\n      ctx.font = \"11px sans-serif\";\n      ctx.textAlign = \"center\";\n      ctx.textBaseline = \"middle\";\n      ctx.fillText(\"💣\", k.x + BRICK_W / 2, k.y + BRICK_H / 2 + 1);\n      ctx.textBaseline = \"alphabetic\";\n    }\n\n    draw(phase) {\n      const ctx = this.ctx;\n      // 배경\n      ctx.fillStyle = \"#0F1633\";\n      ctx.fillRect(0, 0, W, H);\n      ctx.fillStyle = \"rgba(77, 225, 232, .07)\";\n      for (let x = 0; x < W; x += 16) ctx.fillRect(x, 0, 1, H);\n      for (let y = 0; y < H; y += 16) ctx.fillRect(0, y, W, 1);\n      ctx.fillStyle = \"#3B3470\";\n      ctx.fillRect(0, 0, W, 4); ctx.fillRect(0, 0, 4, H); ctx.fillRect(W - 4, 0, 4, H);\n\n      // 벽돌\n      for (const k of this.bricks) {\n        if (!k.alive) continue;\n        if (k.bomb) { this.drawBomb(k); continue; }\n        ctx.fillStyle = shade(k.color, -70); ctx.fillRect(k.x, k.y, BRICK_W, BRICK_H);\n        ctx.fillStyle = k.color; ctx.fillRect(k.x, k.y, BRICK_W - 2, BRICK_H - 2);\n        ctx.fillStyle = shade(k.color, 70);\n        ctx.fillRect(k.x, k.y, BRICK_W - 2, 2); ctx.fillRect(k.x, k.y, 2, BRICK_H - 2);\n        ctx.fillStyle = \"rgba(255,255,255,.85)\"; ctx.fillRect(k.x + 3, k.y + 3, 3, 2);\n      }\n\n      // 조각 / +10\n      this.particles.forEach(p => {\n        ctx.globalAlpha = Math.max(0, p.life / .7);\n        ctx.fillStyle = p.color;\n        ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);\n      });\n      ctx.globalAlpha = 1;\n      ctx.font = '8px \"Press Start 2P\", monospace';\n      ctx.textAlign = \"center\";\n      this.blasts.forEach(b => {\n        const t = 1 - b.life / .35;\n        ctx.globalAlpha = 1 - t;\n        ctx.fillStyle = \"#FFE7A0\";\n        ctx.beginPath();\n        ctx.arc(b.x, b.y, 8 + t * 34, 0, Math.PI * 2);\n        ctx.fill();\n      });\n      ctx.globalAlpha = 1;\n      this.popups.forEach(p => {\n        ctx.globalAlpha = Math.min(1, p.life / .4);\n        ctx.fillStyle = \"#000\"; ctx.fillText(p.text, Math.round(p.x) + 1, Math.round(p.y) + 1);\n        ctx.fillStyle = p.color; ctx.fillText(p.text, Math.round(p.x), Math.round(p.y));\n      });\n      ctx.globalAlpha = 1;\n\n      // 구름 패들\n      const by = bob(this.seed);\n      ctx.globalAlpha = this.state === \"out\" ? .35 : 1;\n      ctx.drawImage(this.cloud, Math.round(this.paddle.x), this.paddle.y + by);\n      ctx.globalAlpha = 1;\n\n      // 공\n      if (this.state === \"hold\" || this.state === \"fly\") {\n        const b = this.ball;\n        const x = Math.round(b.x), y = Math.round(b.y) + (this.state === \"hold\" ? by : 0);\n        ctx.fillStyle = \"#FFFFFF\";\n        ctx.fillRect(x + 1, y, b.size - 2, b.size);\n        ctx.fillRect(x, y + 1, b.size, b.size - 2);\n      }\n\n      // 안내 글자\n      const blinkOn = Math.floor(performance.now() / 500) % 2 === 0;\n      let msg = \"\", color = \"#FFD23F\";\n      if (this.state === \"out\") { msg = \"GAME OVER\"; color = \"#FF5D8F\"; }\n      else if (phase === \"ready\" && blinkOn) msg = \"READY?\";\n      else if (phase === \"running\" && this.state === \"hold\" && !this.isCpu && blinkOn) msg = \"PRESS SPACE\";\n      else if (phase === \"running\" && this.state === \"refill\")\n        msg = \"CLEAR!\";\n      else if (phase === \"ended\") msg = \"TIME UP\";\n      if (msg) {\n        ctx.font = '10px \"Press Start 2P\", monospace';\n        ctx.textAlign = \"center\";\n        ctx.fillStyle = \"#000\"; ctx.fillText(msg, W / 2 + 1, 191);\n        ctx.fillStyle = color; ctx.fillText(msg, W / 2, 190);\n      }\n    }\n  }\n\n  // ================= 대결 진행 =================\n  const me = new Board(document.getElementById(\"meCanvas\"), {\n    isCpu: false, cloud: CLOUD_ME,\n    scoreEl: document.getElementById(\"meScore\"), livesEl: document.getElementById(\"meLives\"),\n    stageEl: document.getElementById(\"meStage\")\n  });\n  const cpu = new Board(document.getElementById(\"cpuCanvas\"), {\n    isCpu: true, cloud: CLOUD_CPU,\n    scoreEl: document.getElementById(\"cpuScore\"), livesEl: document.getElementById(\"cpuLives\"),\n    stageEl: document.getElementById(\"cpuStage\")\n  });\n\n  const timeEl = document.getElementById(\"time\");\n  const timerBox = document.getElementById(\"timerBox\");\n  const startBtn = document.getElementById(\"startBtn\");\n  const resultEl = document.getElementById(\"result\");\n\n  let phase = \"ready\";   // ready → running → ended\n  let timeLeft = GAME_SECONDS;\n\n  let matchStage = 1;   // 지금 도전 중인 단계\n  const stageNow = document.getElementById(\"stageNow\");\n\n  function setStage(n) {\n    matchStage = n;\n    stageNow.textContent = \"STAGE \" + n;\n  }\n\n  function startGame() {\n    me.reset(matchStage); cpu.reset(matchStage);\n    timeLeft = GAME_SECONDS;\n    timeEl.textContent = GAME_SECONDS;\n    timerBox.classList.remove(\"low\");\n    phase = \"running\";\n    startBtn.disabled = true;\n    startBtn.textContent = \"대결 중\";\n    resultEl.innerHTML = `<div class=\"hint pop\">⚔️ ${matchStage}단계 대결 중! 컴퓨터보다 벽돌을 많이 깨요<\/div>`;\n    window.focus();\n  }\n\n  function endGame() {\n    phase = \"ended\";\n    timeEl.textContent = Math.max(0, Math.ceil(timeLeft));\n    timerBox.classList.remove(\"low\");\n    startBtn.disabled = false;\n\n    const a = me.score, b = cpu.score;\n    let emoji, text, cls;\n    if (a > b)      { emoji = \"🥳\"; text = \"이겼다!\"; cls = \"win\"; }\n    else if (a < b) { emoji = \"😭\"; text = \"졌다…\";  cls = \"lose\"; }\n    else            { emoji = \"😮\"; text = \"비겼다!\"; cls = \"draw\"; }\n\n    let html = `\n      <div class=\"emoji pop\">${emoji}<\/div>\n      <div class=\"verdict ${cls} pop\">${text}<\/div>\n      <div class=\"scores\">${matchStage}단계 · 나 ${a} : ${b} 컴퓨터<\/div>`;\n    let actions = [];\n\n    if (cls === \"win\" && matchStage < MAX_STAGE) {\n      const next = matchStage + 1;\n      html += `<div class=\"congrats pop\">축하해요 🎉 ${next}단계로 넘어가요!<\/div>`;\n      actions.push({ label: `${next}단계 시작 ▶`, run: () => { setStage(next); startGame(); } });\n      setStage(next);                       // 위쪽 게임 시작 버튼도 다음 단계로\n      startBtn.textContent = `${next}단계 시작`;\n    } else if (cls === \"win\") {\n      html += `<div class=\"congrats pop\">축하해요 🎉 모든 단계를 클리어했어요! 🏆<\/div>`;\n      actions.push({ label: \"1단계부터 다시\", run: () => { setStage(1); startGame(); } });\n      setStage(1);\n      startBtn.textContent = \"게임 시작\";\n    } else {\n      html += `<div class=\"congrats pop\" style=\"color:var(--cyan)\">이겨야 다음 단계로 갈 수 있어요<\/div>`;\n      actions.push({ label: `${matchStage}단계 다시 도전`, run: startGame });\n      startBtn.textContent = `${matchStage}단계 다시`;\n    }\n\n    html += `<div class=\"buttons\">${actions.map((x, i) =>\n      `<button class=\"start${i ? \" sub\" : \"\"}\" data-i=\"${i}\">${x.label}<\/button>`).join(\"\")}<\/div>`;\n    resultEl.innerHTML = html;\n    resultEl.querySelectorAll(\".buttons .start\").forEach(btn =>\n      btn.addEventListener(\"click\", () => actions[btn.dataset.i].run()));\n    const first = resultEl.querySelector(\".buttons .start\");\n    if (first) first.focus();\n  }\n\n  startBtn.addEventListener(\"click\", startGame);\n\n  // ================= 입력 =================\n  const keys = { left: false, right: false };\n  window.addEventListener(\"keydown\", e => {\n    if (e.target.tagName === \"BUTTON\" && (e.key === \" \" || e.key === \"Enter\")) return; // 버튼은 버튼대로\n    if (e.key === \"ArrowLeft\")  { keys.left = true;  me.targetX = null; e.preventDefault(); }\n    if (e.key === \"ArrowRight\") { keys.right = true; me.targetX = null; e.preventDefault(); }\n    if (e.key === \" \" || e.code === \"Space\") {\n      e.preventDefault();\n      if (!e.repeat && phase === \"running\") me.launch();\n    }\n  });\n  window.addEventListener(\"keyup\", e => {\n    if (e.key === \"ArrowLeft\")  keys.left = false;\n    if (e.key === \"ArrowRight\") keys.right = false;\n  });\n  window.addEventListener(\"blur\", () => { keys.left = keys.right = false; });\n\n  // 휴대폰: 내 화면을 손가락으로 끌면 구름이 따라오고, 탭하면 발사\n  const meCanvas = document.getElementById(\"meCanvas\");\n  function pointerToX(e) {\n    const r = meCanvas.getBoundingClientRect();\n    return (e.clientX - r.left) / r.width * W;\n  }\n  meCanvas.addEventListener(\"pointerdown\", e => {\n    me.targetX = pointerToX(e);\n    meCanvas.setPointerCapture(e.pointerId);\n    if (phase === \"running\") me.launch();\n  });\n  meCanvas.addEventListener(\"pointermove\", e => {\n    if (e.buttons || e.pointerType === \"touch\") me.targetX = pointerToX(e);\n  });\n\n  // ================= 메인 루프 =================\n  let last = performance.now();\n  function loop(now) {\n    const dt = Math.min((now - last) / 1000, 0.05);\n    last = now;\n    const running = phase === \"running\";\n\n    if (running) {\n      timeLeft -= dt;\n      const shown = Math.max(0, Math.ceil(timeLeft));\n      if (timeEl.textContent !== String(shown)) timeEl.textContent = shown;\n      timerBox.classList.toggle(\"low\", timeLeft <= 10);\n    }\n\n    me.update(dt, running, keys);\n    cpu.update(dt, running, {});\n    me.draw(phase);\n    cpu.draw(phase);\n\n    if (running && (timeLeft <= 0 || (me.state === \"out\" && cpu.state === \"out\"))) endGame();\n    requestAnimationFrame(loop);\n  }\n  requestAnimationFrame(loop);\n  window.focus();\n<\/script>\n<\/body>\n<\/html>\n"}, {"file": "runner.html", "emoji": "🦘", "color": "#7CC75A", "title": "캥거루 달리기", "desc": "1분 동안 살아남아 캥거루 가족을 완성해요!", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>캥거루 달리기<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --bg: #EAF6E4;\n    --ink: #2F4A2A;\n    --leaf: #5FA84A;\n    --leaf-d: #3F8530;\n    --card: #FFFFFF;\n    box-sizing: border-box;\n    padding-top: env(safe-area-inset-top, 0px);\n    padding-bottom: env(safe-area-inset-bottom, 0px);\n  }\n  *, *::before, *::after { box-sizing: inherit; }\n  html { scroll-padding-top: env(safe-area-inset-top, 0px); }\n  body {\n    margin: 0;\n    min-height: 100vh;\n    font-family: \"Jua\", \"Apple SD Gothic Neo\", \"Malgun Gothic\", sans-serif;\n    color: var(--ink);\n    background:\n      radial-gradient(circle at 15% 10%, #FFFBE0 0%, transparent 40%),\n      linear-gradient(180deg, #DDF1F8 0%, var(--bg) 60%);\n    display: flex;\n    justify-content: center;\n    padding: 20px 14px 36px;\n  }\n  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }\n  .home {\n    align-self: flex-start;\n    font-size: 1rem;\n    color: var(--ink);\n    text-decoration: none;\n    background: var(--card);\n    border: 2px solid var(--leaf);\n    border-radius: 999px;\n    padding: 5px 14px;\n  }\n  .home:hover { background: #F4FBEF; }\n  .home:focus-visible { outline: 3px solid var(--leaf-d); outline-offset: 2px; }\n  h1 {\n    margin: 0;\n    text-align: center;\n    font-weight: 400;\n    font-size: clamp(2rem, 7vw, 2.8rem);\n    color: var(--leaf-d);\n    text-shadow: 0 3px 0 #FFFFFF;\n  }\n  .stage {\n    position: relative;\n    background: var(--card);\n    border-radius: 22px;\n    padding: 8px;\n    box-shadow: 0 10px 0 #CFE5C4, 0 18px 30px -16px rgba(47, 74, 42, .5);\n  }\n  canvas {\n    display: block;\n    cursor: pointer;\n    touch-action: manipulation;\n    -webkit-tap-highlight-color: transparent;\n    width: 100%;\n    height: auto;\n    border-radius: 16px;\n  }\n  .dodge {\n    position: absolute;\n    left: 50%; bottom: 20px;\n    transform: translateX(-50%);\n    font-family: inherit;\n    font-size: 1.05rem;\n    color: #FFFFFF;\n    background: var(--leaf);\n    border: 3px solid #FFFFFF;\n    border-radius: 999px;\n    padding: 8px 18px;\n    box-shadow: 0 4px 0 var(--leaf-d), 0 6px 14px rgba(47,74,42,.3);\n    cursor: pointer;\n    white-space: nowrap;\n    touch-action: manipulation;\n  }\n  .dodge b { font-weight: 400; background: #FFFFFF; color: var(--leaf-d); border-radius: 999px; padding: 0 8px; margin-left: 4px; }\n  .dodge:disabled { background: #A9B8A2; box-shadow: 0 4px 0 #87967F; cursor: default; }\n  .dodge.ready { animation: glow 1s ease-in-out infinite; }\n  @keyframes glow { 50% { transform: translateX(-50%) scale(1.06); } }\n  .dodge:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }\n  @media (prefers-reduced-motion: reduce) { .dodge.ready { animation: none; } }\n\n  .over {\n    position: absolute; inset:
